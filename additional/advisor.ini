[core]
copyFrom:ROOT:/DATA/Zerg/zergUpgrades.template, ROOT:/DATA/Terran/terranUpgrades.template, ROOT:/DATA/Protoss/protossUpgrades.template
ignoreInUnitCapCalculation:true
showInEditor: false
showOnMinimap:false
name: advisor
tags: advisor
displayText: Advisor
displayText_zh:建议
class: CustomUnitMetadata
price: 0
maxHp: 999999
selfRegenRate: 99
armour: 999999
armourMinDamageToKeep: 999
mass: 10000
techLevel: 1
radius: 0
isBio: false
onNewMapSpawn: mapCenter_eachActiveTeam
transportSlotsNeeded: 1000
isUnrepairableUnit: true
explodeOnDeath: false
hideScorchMark: true
fogOfWarSightRange: 0
softCollisionOnAll: 100
disableAllUnitCollisions:true
canNotBeDirectlyAttacked:true
isUnselectable:true
autoTriggerCooldownTime: 0.1s
@memory changedSupply:float

[hiddenAction_baseAttack]
autoTrigger: if self.resource(type='baseAttack',equalTo=30)
resourceAmount: baseAttack
resourceAmount_setValue: 29
alsoTriggerAction: pBaseAttack, tBaseAttack, zBaseAttack

[hiddenAction_baseAttack_2]
autoTrigger: if self.resource(type='baseAttack',greaterThan=0) and self.resource(type='baseAttack',lessThan=30)
addResources: baseAttack=-1

[hiddenAction_pBaseAttack]
requireConditional: if self.globalTeamTags(includes='Protoss')
playSoundToPlayer:ROOT:/DATA/Protoss/pBaseAttack.ogg:0.5

[hiddenAction_tBaseAttack]
requireConditional: if self.globalTeamTags(includes='Terran')
playSoundToPlayer:ROOT:/DATA/Terran/tBaseAttack.ogg:0.4

[hiddenAction_zBaseAttack]
requireConditional: if self.globalTeamTags(includes='Zerg')
playSoundToPlayer:ROOT:/DATA/Zerg/zBaseAttack.ogg:0.4

[hiddenAction_forcesAttack]
autoTrigger: if self.resource(type='forcesAttack',equalTo=30)
resourceAmount: forcesAttack
resourceAmount_setValue: 29
alsoTriggerAction: pForcesAttack, tForcesAttack, zForcesAttack

[hiddenAction_forcesAttack_2]
autoTrigger: if self.resource(type='forcesAttack',greaterThan=0) and self.resource(type='forcesAttack',lessThan=30)
addResources: forcesAttack=-1

[hiddenAction_pForcesAttack]
requireConditional: if self.globalTeamTags(includes='Protoss')
playSoundToPlayer:ROOT:/DATA/Protoss/pForcesAttack.ogg:0.6

[hiddenAction_tForcesAttack]
requireConditional: if self.globalTeamTags(includes='Terran')
playSoundToPlayer:ROOT:/DATA/Terran/tForcesAttack.ogg:0.4

[hiddenAction_zForcesAttack]
requireConditional: if self.globalTeamTags(includes='Zerg')
playSoundToPlayer:ROOT:/DATA/Zerg/zForcesAttack.ogg:0.4




[hiddenAction_changeSupply_reduce]
autoTrigger: if self.resource.maxSupply>200 and not self.globalTeamTags(includes="withoutSupplyLimitation")
addResourcesWithLogic:"""
supply=200-self.resource.maxSupply,
remainSupply=self.resource.maxSupply-200,
maxSupply=200-self.resource.maxSupply
"""

[hiddenAction_changeSupply_append]
autoTrigger: if self.resource.remainSupply>0 and self.resource.maxSupply<200
setUnitMemory: changedSupply=min(200-self.resource.maxSupply,self.resource.remainSupply)
alsoTriggerAction: append_supply, append_maxSupply, append_remainSupply
[hiddenAction_append_supply]
addResourcesWithLogic: supply=memory.changedSupply
[hiddenAction_append_maxSupply]
addResourcesWithLogic: maxSupply=memory.changedSupply
[hiddenAction_append_remainSupply]
addResourcesWithLogic: remainSupply=-1*memory.changedSupply




[hiddenAction_supplyBlock]
autoTrigger: if self.globalTeamTags(includes='SupplyBlock')
removeGlobalTeamTags: SupplyBlock
alsoTriggerAction: pSupplyBlock, tSupplyBlock, zSupplyBlock

[hiddenAction_pSupplyBlock]
requireConditional: if self.globalTeamTags(includes='Protoss')
playSoundToPlayer:ROOT:/DATA/Protoss/pSupplyBlock.ogg:0.6

[hiddenAction_tSupplyBlock]
requireConditional: if self.globalTeamTags(includes='Terran')
playSoundToPlayer:ROOT:/DATA/Terran/tSupplyBlock.ogg:0.4

[hiddenAction_zSupplyBlock]
requireConditional: if self.globalTeamTags(includes='Zerg')
playSoundToPlayer:ROOT:/DATA/Zerg/zSupplyBlock.ogg:0.5

[hiddenAction_allUpgrades]
autoTrigger: if self.globalTeamTags(includes="AllUpgrades") and not self.globalTeamTags(includes="AllUpgradesAdd")
addGlobalTeamTags: AllUpgradesAdd
setResourcesWithLogic: """
ZergMeleeAttack=3,
ZergRangeAttack=3,
ZergAirAttack=3,
ZergGroundCarapace=3,
ZergAirCarapace=3,
TerranInfantryAttack=3,
TerranVehicleAttack=3,
TerranAirAttack=3,
TerranInfantryArmor=3,
TerranVehicleArmor=3,
TerranAirArmor=3,
ProtossGroundAttack=3,
ProtossAirAttack=3,
ProtossGroundArmor=3,
ProtossAirArmor=3,
ProtossShieldArmor=3
"""



[hiddenAction_startTimer]
autoTrigger: if self.resource.Second2==0 and self.resource.Second==0 and self.resource.Minute2==0 and self.resource.Minute==0 and self.resource.Hour==0
addResources:Second2=0.001, Second=0.001, Minute2=0.001, Minute=0.001, Hour=0.001

[hiddenAction_Timer]
autoTrigger: if numberOfUnitsInAllTeams(withTag="notReady")<=0 and self.timeAlive>=1
addResources: Second=0.1
alsoTriggerAction:Seconds

[hiddenAction_Seconds]
requireConditional: if self.resource.Second>=10
autoTrigger: ${section.requireConditional}
convertResource_from: Second
convertResource_to: Second2
convertResource_minAmount: 10
convertResource_maxAmount: 10
convertResource_multiplyAmountBy: 0.1
alsoTriggerAction:Seconds_2

[hiddenAction_Seconds_2]
requireConditional: if self.resource.Second2>=5.9
autoTrigger: ${section.requireConditional}
convertResource_from: Second2
convertResource_to: Minute
convertResource_minAmount: 6
convertResource_maxAmount: 6
convertResource_multiplyAmountBy: 0.1667
alsoTriggerAction:Minute

[hiddenAction_Minute]
requireConditional: if self.resource.Minute>=9
autoTrigger: ${section.requireConditional}
convertResource_from: Minute
convertResource_to: Minute2
convertResource_minAmount: 10
convertResource_maxAmount: 10
convertResource_multiplyAmountBy: 0.1
alsoTriggerAction:Minute_2

[hiddenAction_Minute_2]
requireConditional: if self.resource.Minute2>=5.9
autoTrigger: ${section.requireConditional}
convertResource_from: Minute2
convertResource_to: Hour
convertResource_minAmount: 6
convertResource_maxAmount: 6
convertResource_multiplyAmountBy: 0.1667

[graphics]
image: ROOT:/DATA/total/null.png
image_wreak:  NONE
image_shadow: NONE
showEnergyBar: false

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[movement]
movementType: NONE