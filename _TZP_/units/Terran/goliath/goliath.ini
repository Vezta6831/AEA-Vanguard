[decal_body]
@define dir0: (directionBetween(self,memory.attackTarget)>=-22.5 and directionBetween(self,memory.attackTarget)<=22.5)
@define dir45: (directionBetween(self,memory.attackTarget)>=22.5 and directionBetween(self,memory.attackTarget)<=67.5)
@define dir90: (directionBetween(self,memory.attackTarget)>=67.5 and directionBetween(self,memory.attackTarget)<=112.5)
@define dir135: (directionBetween(self,memory.attackTarget)>=112.5 and directionBetween(self,memory.attackTarget)<=157.5)
@define dir180: ((directionBetween(self,memory.attackTarget)>=157.5 and directionBetween(self,memory.attackTarget)<=180) or (directionBetween(self,memory.attackTarget)<=-157.5 and directionBetween(self,memory.attackTarget)>=-180))
@define dir225: (directionBetween(self,memory.attackTarget)<=-112.5 and directionBetween(self,memory.attackTarget)>=-157.5)
@define dir270: (directionBetween(self,memory.attackTarget)<=-67.5 and directionBetween(self,memory.attackTarget)>=-112.5)
@define dir315: (directionBetween(self,memory.attackTarget)<=-22.5 and directionBetween(self,memory.attackTarget)>=-67.5)
@define totalFrames:12
layer: afterBody
image:goliath_body.png
onlyOnNonPreview:false
alwaysStartDirAtZero:true
teamColors:true
yOffsetAbsolute:${graphics.image_offsetY}
frame_width:  76
frame_height: 76
frame: select(${dir0},4,select(${dir45},5,select(${dir90},6,select(${dir135},7,select(${dir180},0,select(${dir225},1,select(${dir270},2,select(${dir315},3,0))))))))*${totalFrames}
addBodyFrameMultipliedBy:1

