explodeEffectOnShield:CUSTOM:sparks
image:missiles.png
directDamage:10
areaDamage:24
areaRadius:45
life: 240
speed: 4
targetSpeed: 8
trailEffect:CUSTOM:smoke
trailEffectRate:6
