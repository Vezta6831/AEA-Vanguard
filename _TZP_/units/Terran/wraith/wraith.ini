[core]
copyFrom:ROOT:/DATA/total/forcesAttack.template, ROOT:/DATA/Terran/terranUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: wraith
tags: mech,L,unit,haveEnergy,vis17,gasCost
class: CustomUnitMetadata
price:Gas=210
maxHp: 600
mass: 500
energyMax: 200
energyRegen:0.0124
energyStartingPercentage:0.25
displayText_ru: Мираж
displayText_zh:怨灵战机
displayText: Wraith
techLevel: 1
buildSpeed: 16.5s
#availableInDemo: true
radius: 20
displayRadius: 22
isBio: false
hideScorchMark: false
isBug: false
fogOfWarSightRange:17
isUnrepairableUnit: false
softCollisionOnAll: 250
explodeOnDeath: true
explodeOnDeathGroundCollosion: true
effectOnDeath:CUSTOM:corpse
soundOnMoveOrder:wraith_yes_1.ogg:0.3,wraith_yes_2.ogg:0.3,wraith_yes_3.ogg:0.3,wraith_yes_4.ogg:0.3
soundOnAttackOrder:wraith_yes_1.ogg:0.3,wraith_yes_2.ogg:0.3,wraith_yes_3.ogg:0.3,wraith_yes_4.ogg:0.3
soundOnNewSelection:wraith_what_1.ogg:0.3,wraith_what_2.ogg:0.3,wraith_what_3.ogg:0.3,wraith_what_4.ogg:0.3

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 90
alpha: 9
image:ROOT:/DATA/Terran/units/death.png
priority: critical
drawUnderUnits:false
animateFrameStart:0
animateFrameEnd:8
animateFrameSpeed:0.2
alsoPlaySound:death.wav
frame_width:  128
frame_height: 128

[hiddenAction_soundOnCreate]
autoTriggerOnEvent: created
playSoundToPlayer:wraith_ready.ogg
requireConditional:if self.customTarget1!=nullUnit
addWaypoint_type:move
addWaypoint_target_fromReference: customTarget1.readUnitMemory(name="rally",type="unit")

[effect_sparks]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 10
image:ROOT:/DATA/Terran/units/explode.png
priority: critical
drawUnderUnits:false
total_frames:10
animateFrameStart:0
animateFrameEnd:9
animateFrameSpeed:0.2

[effect_sparks_2]
alwayStartDirAtZero:true
attachedToUnit: false
life: 90
alpha: 9
image:ROOT:/DATA/Terran/units/explode_2.png
priority: critical
drawUnderUnits:false
total_frames:9
animateFrameStart:0
animateFrameEnd:8
animateFrameSpeed:0.2
frame_width:  56
frame_height: 56

[effect_smoke]
alwayStartDirAtZero:true
attachedToUnit: false
life: 80
alpha: 8
hSpeed: 0
image:ROOT:/DATA/Terran/units/smoke.png
priority: critical
drawUnderUnits:false
total_frames:8
animateFrameStart:0
animateFrameEnd:7
animateFrameSpeed:0.2
scaleFrom:1
scaleTo:1
yOffsetRelative:-20

[action_invis]
alwaysSinglePress:true
isVisible: if self.globalTeamTags(includes='ControlTowerMirage')
isActive: if self.resource.lockdown<=0 and self.resource.stasis<=0
displayType:infoOnly
buildSpeed:0s
text_ru:Маскирующее поле
text:Personnel cloaking
text_zh:隐形
convertTo_keepCurrentFields: armour
convertTo:wraithInvis
price:energy=25
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Terran/cloak.png
iconImage:ROOT:/DATA/Terran/cloak.png
ai_isHighPriority: true
isLocked: if self.isControlledByAI() and ((not self.isAttacking() and distanceBetween(self, self.activeWaypointTarget)>320) or not self.isAttacking())
playSoundAtUnit:ROOT:/DATA/total/cloaking.ogg:0.4

[hiddenAction_armour]
@copyFromSection:template_set_armour
@define armourUpgradeType: TerranAirArmor

[hiddenAction_maxEnergy]
autoTrigger: if self.globalTeamTags(includes='ApolloReactor') and self.maxEnergy!=250
temporarilyAddTags: maxEnergy
setUnitStats: maxEnergy=250

[hiddenAction_startingEnergy]
autoTriggerOnEvent:created
requireConditional: if self.globalTeamTags(includes='ApolloReactor')
setUnitStats:energy=62

[action_portrait]
unitShownInUI:portrait_wraith

[graphics]
image_offsetY:-10
total_frames: 2
icon_build: wraith_icon.png
image:        wraith.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO_ANIMATED
animation_moving_start: 1
animation_moving_end: 2
animation_moving_speed: 1
lock_body_rotation_with_main_turret: true
rotate_with_direction: false
animation_direction_units: 45
animation_direction_strideX:3
animation_direction_strideY:0
animation_direction_starting:180
frame_width:  64
frame_height: 64
imageScale: 0.87

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 6
turretTurnSpeed: 3
maxAttackRange: 200
shootDelay: 0.91s
showRangeUIGuide:true

[turret_T1T2]
showRangeUIGuide:false
canAttackCondition: if self.resource(type='TerranAirAttack',equalTo=0) or self.resource(type='TerranAirAttack',equalTo=1)
x: 0
y: 0
shoot_sound:attack.ogg
shoot_sound_vol:0.3
recoilOffset: 0
#barrelHeight: 10
projectile:T1
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
altProjectile: T2
altProjectileCondition: if self.resource(type='TerranAirAttack',equalTo=1)

[turret_T3T4]
canAttackCondition: if self.resource(type='TerranAirAttack',equalTo=2) or self.resource(type='TerranAirAttack',equalTo=3)
@copyFromSection:turret_T1T2
projectile:T3
altProjectile: T4
altProjectileCondition: if self.resource(type='TerranAirAttack',equalTo=3)

[projectile_T1]
explodeEffect:CUSTOM:sparks_2
explodeEffectOnShield:CUSTOM:sparks_2
image:fire.png
directDamage: 78
life: 160
speed:12
mutator1_ifUnitWithTags: zergSwarm
mutator1_directDamageMultiplier:0
mutator2_ifUnitWithTags:hallucination
mutator2_directDamageMultiplier:2

[projectile_T2]
directDamage:82
@copyFromSection:projectile_T1

[projectile_T3]
directDamage:86
@copyFromSection:projectile_T1

[projectile_T4]
directDamage:90
@copyFromSection:projectile_T1

[turret_T1T2_2]
showRangeUIGuide:false
canAttackCondition: if self.resource(type='TerranAirAttack',equalTo=0) or self.resource(type='TerranAirAttack',equalTo=1)
projectile:T1_2
x: 0
y: 0
delay:0.924s
#barrelHeight: 10
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
shoot_sound:rocket.wav
shoot_sound_vol:0.2
altProjectile: T2_2
altProjectileCondition: if self.resource(type='TerranAirAttack',equalTo=1)

[turret_T3T4_2]
canAttackCondition: if self.resource(type='TerranAirAttack',equalTo=2) or self.resource(type='TerranAirAttack',equalTo=3)
@copyFromSection:turret_T1T2_2
projectile:T3_2
altProjectile: T4_2
altProjectileCondition: if self.resource(type='TerranAirAttack',equalTo=3)

[projectile_T1_2]
