[decal_turret]
@define dir0: (directionBetween(self,memory.attackTarget)>=-22.5 and directionBetween(self,memory.attackTarget)<=22.5)
@define dir45: (directionBetween(self,memory.attackTarget)>=22.5 and directionBetween(self,memory.attackTarget)<=67.5)
@define dir90: (directionBetween(self,memory.attackTarget)>=67.5 and directionBetween(self,memory.attackTarget)<=112.5)
@define dir135: (directionBetween(self,memory.attackTarget)>=112.5 and directionBetween(self,memory.attackTarget)<=157.5)
@define dir180: ((directionBetween(self,memory.attackTarget)>=157.5 and directionBetween(self,memory.attackTarget)<=180) or (directionBetween(self,memory.attackTarget)<=-157.5 and directionBetween(self,memory.attackTarget)>=-180))
@define dir225: (directionBetween(self,memory.attackTarget)<=-112.5 and directionBetween(self,memory.attackTarget)>=-157.5)
@define dir270: (directionBetween(self,memory.attackTarget)<=-67.5 and directionBetween(self,memory.attackTarget)>=-112.5)
@define dir315: (directionBetween(self,memory.attackTarget)<=-22.5 and directionBetween(self,memory.attackTarget)>=-67.5)

@define t_dir0: (self.dir>=-22.5 and self.dir<=22.5)
@define t_dir45: (self.dir>=22.5 and self.dir<=67.5)
@define t_dir90: (self.dir>=67.5 and self.dir<=112.5)
@define t_dir135: (self.dir>=112.5 and self.dir<=157.5)
@define t_dir180: ((self.dir>=157.5 and self.dir<=180) or (self.dir<=-157.5 and self.dir>=-180))
@define t_dir225: (self.dir<=-112.5 and self.dir>=-157.5)
@define t_dir270: (self.dir<=-67.5 and self.dir>=-112.5)
@define t_dir315: (self.dir<=-22.5 and self.dir>=-67.5)

@define totalFrames:2
layer: afterBody
image:tank_turret.png
onlyOnNonPreview:false
alwaysStartDirAtZero:true
teamColors:true
frame_width:  128
frame_height: 128
frame: select(${dir0},4,select(${dir45},5,select(${dir90},6,select(${dir135},7,select(${dir180},0,select(${dir225},1,select(${dir270},2,select(${dir315},3,0))))))))*${totalFrames}+select(self.timeAlive-memory.shootAnim<=0.1 and memory.shootAnim!=0,1,0)
xOffsetAbsolute:select(${t_dir0},-13,select(${t_dir45},-9,select(${t_dir90},0,select(${t_dir135},9,select(${t_dir180},13,select(${t_dir225},10,select(${t_dir270},0,select(${t_dir315},-10,0))))))))
yOffsetAbsolute:-1*select(${t_dir0},10,select(${t_dir45},16,select(${t_dir90},19,select(${t_dir135},16,select(${t_dir180},10,select(${t_dir225},3,select(${t_dir270},1,select(${t_dir315},3,0))))))))+${graphics.image_offsetY}

