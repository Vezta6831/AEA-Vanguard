armour:2
mass: 9999
displayText_ru: Осадный танк
displayText: Siege tank
displayText_zh:攻城坦克
techLevel: 1
buildSpeed: 26s
#availableInDemo: true
radius: 30
displayRadius: 32
isBio: true
hideScorchMark: true
isBug: false
isUnrepairableUnit: false
softCollisionOnAll: 5
transportSlotsNeeded: 4
fogOfWarSightRange:17
effectOnDeath:CUSTOM:corpse
soundOnMoveOrder:siegeTank_yes_1.ogg:0.3,siegeTank_yes_2.ogg:0.3,siegeTank_yes_3.ogg:0.3,siegeTank_yes_4.ogg:0.3
soundOnAttackOrder:siegeTank_yes_1.ogg:0.3,siegeTank_yes_2.ogg:0.3,siegeTank_yes_3.ogg:0.3,siegeTank_yes_4.ogg:0.3
soundOnNewSelection:siegeTank_what_1.ogg:0.3,siegeTank_what_2.ogg:0.3,siegeTank_what_3.ogg:0.3,siegeTank_what_4.ogg:0.3
@memory attackTarget:unit
@memory shootAnim:float
updateUnitMemory: attackTarget=select(attacking!=nullUnit and attacking.hp>0, attacking, select(memory.attackTarget!=nullUnit and memory.attackTarget.teamId!=self.teamId and (memory.attackTarget.hp>0 or self.speed==0) and distanceBetween(self,memory.attackTarget)<=280,memory.attackTarget,self.getOffsetRelative(0,20)))
updateUnitMemoryRate:0.05s

[hiddenAction_shootAnim]
setUnitMemory:shootAnim=self.timeAlive

[effect_sparks]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 10
image:ROOT:/DATA/Terran/units/explode.png
priority: critical
drawUnderUnits:false
total_frames:10
animateFrameStart:0
animateFrameEnd:9
animateFrameSpeed:0.2

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 90
alpha: 9
image:ROOT:/DATA/Terran/units/death.png
priority: critical
drawUnderUnits: true
animateFrameStart:0
animateFrameEnd:8
animateFrameSpeed:0.2
alsoPlaySound:death.wav
frame_width:  128
frame_height: 128

[hiddenAction_soundOnCreate]
autoTriggerOnEvent: created
playSoundToPlayer:siegeTank_ready.ogg
requireConditional:if self.customTarget1!=nullUnit
addWaypoint_type:move
addWaypoint_target_fromReference: customTarget1.readUnitMemory(name="rally",type="unit")

[action_siege]
alwaysSinglePress:true
isVisible: if self.globalTeamTags(includes='MachineShopTank')
isActive: if self.globalTeamTags(includes='MachineShopTank') and self.queueSize(equalTo=0) and self.resource.lockdown<=0 and self.resource.stasis<=0
isLocked: if self.isControlledByAI() and ((not self.isAttacking() and distanceBetween(self, self.activeWaypointTarget)>480) or not self.isAttacking())
price:  0
text_ru:Режим осады
text:Siege mode
text_zh:攻城模式
displayType:infoOnly
buildSpeed: 0s
ai_isHighPriority:true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Terran/siegeMod.png
iconImage:ROOT:/DATA/Terran/siegeMod.png
playSoundAtUnit:siege.ogg:0.3
alsoQueueAction:siege_2
setBodyRotation: 45
allowMultipleInQueue:false
clearAllWaypoints:true

[hiddenAction_siege_2]
convertTo: siegeTank2
buildSpeed: 4s
highPriorityQueue: true
whenBuilding_playAnimation:siege
whenBuilding_temporarilyConvertTo: siegeTank2
whenBuilding_cannotMove:true
whenBuilding_rotateTo: 45
setBodyRotation: 225
canPlayerCancel:false
clearAllWaypoints:true
convertTo_keepCurrentFields: fogOfWarSightRange, maxShield, armour
whenBuilding_temporarilyConvertTo_keepFields: fogOfWarSightRange, maxShield, armour

[hiddenAction_armour]
@copyFromSection:template_set_armour
@define armourUpgradeType: TerranVehicleArmor

[action_portrait]
