[movement]
movementType: BUILDING
moveSpeed: 0
moveAccelerationSpeed: 20
moveDecelerationSpeed: 20
maxTurnSpeed: 20
#turnAcceleration: 20
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:0
joinsGroupFormations: false
ignoreMoveOrders:true

[ai]
buildPriority: 0.8
noneInBaseExtraPriority: 0.8
noneGlobalExtraPriority: 0.8
maxEachBase: 10

[animation_attack]
onActions: attack
body_0s: {frame:0}
body_0.1s: {frame:2}
body_0.15s: {frame:2}
pingPong: true

[animation_siege]
body_0s: {frame:18}
body_0.2s: {frame:17} 
body_0.4s: {frame:16}
body_0.6s: {frame:15}
body_1.2s: {frame:14}
body_1.35s: {frame:13}
body_1.5s: {frame:12}
body_1.75s: {frame:11}
body_1.9s: {frame:10}
body_2.05s: {frame:9}
body_2.2s: {frame:9}
direction_units: 0
direction_strideX:0
direction_strideY:0

[decal_ensnare_goo]
image:ROOT:/DATA/total/ensnare_goo_3.png

[decal_plague_goo]
image:ROOT:/DATA/total/plague_goo_3.png

[decal_lockdown]
image:ROOT:/DATA/total/lockdown_3.png

[decal_defensive_matrix]
image:ROOT:/DATA/total/defensive_matrix_3.png

[effect_mindControl]
