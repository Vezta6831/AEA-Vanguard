[hiddenAction_soundOnCreate]
autoTriggerOnEvent: created
playSoundToPlayer:battlecruiser_ready.ogg
requireConditional:if self.customTarget1!=nullUnit
addWaypoint_type:move
addWaypoint_target_fromReference: customTarget1.readUnitMemory(name="rally",type="unit")

[action_yamato]
isVisible: if self.globalTeamTags(includes='PhysicalLabButtlecruiser')
isActive: if self.resource.lockdown<=0 and self.resource.stasis<=0 and memory.yamato==null
alwaysSinglePress:true
price:energy=150
displayType:infoOnly
buildSpeed:0s
text_ru:Пушка Ямато
text:Yamato gun
text_zh:大和炮
isGuiBlinking: if memory.yamato!=null
onlyOneUnitAtATime: true
fireTurretXAtGround:null
fireTurretXAtGround_withProjectile:null
ai_isDisabled: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Terran/yamato.png
addResources:energy=150
alsoTriggerAction:yamato_2
alsoTriggerOrQueueActionConditional: if createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, relation='enemy') != nullUnit and (createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, relation='enemy').tags(includes="unit") or createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, relation='enemy').tags(includes="building"))

[hiddenAction_yamato_2]
addWaypoint_type: touchTarget
clearAllWaypoints:true
addWaypoint_target_fromReference: createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, relation='enemy')
setUnitMemory: yamato=createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, relation='enemy')

[hiddenAction_yamato_3]
autoTrigger: if memory.yamato!=nullUnit and memory.yamato.hp>0 and distanceBetween(self, memory.yamato)<=310 and self.energy>=150 and self.resource.lockdown<=0 and self.resource.stasis<=0
addResources:energy=-150
playSoundAtUnit:yamato.wav:0.3
addWaypoint_type: attack
clearAllWaypoints:true
addWaypoint_target_fromReference: memory.yamato
setUnitMemory:yamatoTarget=memory.yamato
alsoQueueAction:yamatoActivate

[hiddenAction_removeYamato]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional: if memory.yamato!=nullUnit
autoTrigger: if (memory.yamato!=nullUnit and (self.energy<150 or memory.yamato.hp<=0)) or (memory.yamato==null and self.ammo>0)
setUnitMemory: yamato=null
setResourcesWithLogic: ammo=0
setUnitStats: maxAttackRange=240

[hiddenAction_yamatoActivate]
tags:yamato
buildSpeed:2s
whenBuilding_cannotMove:true
setResourcesWithLogic: ammo=1
setUnitStats: maxAttackRange=9999
setUnitMemory:yamato=null
addWaypoint_type: attack
clearAllWaypoints:true
addWaypoint_target_fromReference: select(memory.yamatoTarget.parent==nullUnit,memory.yamatoTarget,memory.yamatoTarget.parent)

[hiddenAction_yamato_attackWaypoint]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional: if memory.yamatoTarget!=nullUnit and self.ammo>0
addWaypoint_type: attack
clearAllWaypoints:true
addWaypoint_target_fromReference: select(memory.yamatoTarget.parent==nullUnit,memory.yamatoTarget,memory.yamatoTarget.parent)

[hiddenAction_yamato_theEnd]
autoTrigger: if self.ammo>0 and ((memory.yamatoTarget.hp<=0 and memory.yamato.hp<=0) or (self.resource.lockdown>0 or self.resource.stasis>0))
setUnitMemory: yamatoTarget=null, yamato=null
setResourcesWithLogic: ammo=0
setUnitStats: maxAttackRange=240
clearAllWaypoints:true

[hiddenAction_shootAnim]
setUnitMemory: shootAnim=self.timeAlive

[hiddenAction_armour]
@copyFromSection:template_set_armour
@define armourUpgradeType: TerranAirArmor

[hiddenAction_maxEnergy]
autoTrigger: if self.globalTeamTags(includes='ColossusReactor') and self.maxEnergy!=250
temporarilyAddTags: maxEnergy
setUnitStats: maxEnergy=250

[hiddenAction_startingEnergy]
autoTriggerOnEvent:created
requireConditional: if self.globalTeamTags(includes='ColossusReactor')
setUnitStats:energy=62

[action_portrait]
unitShownInUI:portrait_battlecruiser

