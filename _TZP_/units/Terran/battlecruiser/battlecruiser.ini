[decal_shoot]
@define dir0: (self.dir>=-22.5 and self.dir<=22.5)
@define dir45: (self.dir>=22.5 and self.dir<=67.5)
@define dir90: (self.dir>=67.5 and self.dir<=112.5)
@define dir135: (self.dir>=112.5 and self.dir<=157.5)
@define dir180: ((self.dir>=157.5 and self.dir<=180) or (self.dir<=-157.5 and self.dir>=-180))
@define dir225: (self.dir<=-112.5 and self.dir>=-157.5)
@define dir270: (self.dir<=-67.5 and self.dir>=-112.5)
@define dir315: (self.dir<=-22.5 and self.dir>=-67.5)
@define totalFrames:5
@define framesPerSec: 12
isVisible: if memory.shootAnim!=0 and self.timeAlive-memory.shootAnim<=1/${framesPerSec}*${totalFrames}
image:shoot.png
frame_width:120
frame_height:120
layer: afterBody
alwaysStartDirAtZero:true
teamColors:false
onlyWhileAlive: true
frame: (select(${dir0},4,select(${dir45},5,select(${dir90},6,select(${dir135},7,select(${dir180},0,select(${dir225},1,select(${dir270},2,select(${dir315},3,0))))))))*${totalFrames})+((self.timeAlive-memory.shootAnim)*${framesPerSec})
yOffsetAbsolute:-14

[decal_yamato]
@define totalFrames:6
@define framesPerSec: 12
isVisible: if self.queueSize(withActionTag="yamato")>0
layer: afterBody
image:yamato_shoot.png
onlyOnNonPreview:true
alwaysStartDirAtZero:true
teamColors:false
yOffsetAbsolute:-14
yOffsetRelative:40
frame_width:160
frame_height:160
frame: self.timeAlive*${framesPerSec}%${totalFrames}
onlyWhileAlive: true

