[core]
copyFrom:ROOT:/DATA/total/forcesAttack.template, ROOT:/DATA/Terran/terranUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: tvulture
tags: mech, M, unit, hover,vis17,groundUnit
class: CustomUnitMetadata
price:Gas=125
maxHp: 610
energyMax:3
energyRegen:0
mass: 500
displayText_ru: Стервятник
displayText: Vulture
displayText_zh:秃鹫战车
techLevel: 1
buildSpeed: 14s
radius: 22
displayRadius: 24
isBio: false
hideScorchMark: false
isBug: false
isUnrepairableUnit: false
fogOfWarSightRange:17
softCollisionOnAll: 5
transportSlotsNeeded: 2
effectOnDeath:CUSTOM:corpse
defineUnitMemory: unit target
soundOnMoveOrder:vulture_yes_1.ogg:0.3,vulture_yes_2.ogg:0.3,vulture_yes_3.ogg:0.3,vulture_yes_4.ogg:0.3
soundOnAttackOrder:vulture_yes_1.ogg:0.3,vulture_yes_2.ogg:0.3,vulture_yes_3.ogg:0.3,vulture_yes_4.ogg:0.3
soundOnNewSelection:vulture_what_1.ogg:0.3,vulture_what_2.ogg:0.3,vulture_what_3.ogg:0.3,vulture_what_4.ogg:0.3

[action_spiderMine]
isVisible: if self.globalTeamTags(includes='MachineShopMine')
isActive: if self.resource.lockdown<=0 and self.resource.stasis<=0
price:energy=1
text_ru: Мина
text: Mine
text_zh:蜘蛛雷
displayType:infoOnly
buildSpeed: 0s
alwaysSinglePress:true
highPriorityQueue: false
onlyOneUnitAtATime: true
ai_isDisabled:true
iconExtraColor:#FFFFFFFF
iconExtraImage:spiderMine.png
addWaypoint_type: move
addWaypoint_prepend: true
addWaypoint_position_randomOffsetFromSelf: 35,35
addWaypoint_maxTime: 1s
#clearAllWaypoints:true
spawnUnits: mineAttack
playSoundAtUnit:spawnMine.ogg

[effect_sparks]
alwayStartDirAtZero:true
attachedToUnit: false
life: 90
alpha: 9
image:ROOT:/DATA/Terran/units/explode_2.png
priority: critical
drawUnderUnits:false
total_frames:9
animateFrameStart:0
animateFrameEnd:8
animateFrameSpeed:0.2
frame_width:  56
frame_height: 56

[effect_cloud]
alwayStartDirAtZero:true
attachedToUnit: false
life: 70
alpha: 7
hSpeed: 0
image:cloud.png
priority: critical
drawUnderUnits:false
total_frames:8
animateFrameStart:0
animateFrameEnd:7
animateFrameSpeed:0.2
scaleFrom:1
scaleTo:1

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 90
alpha: 9
image:ROOT:/DATA/Terran/units/death.png
priority: critical
drawUnderUnits: true
animateFrameStart:0
animateFrameEnd:8
animateFrameSpeed:0.2
alsoPlaySound:death.wav
frame_width:  128
frame_height: 128

[hiddenAction_soundOnCreate]
autoTriggerOnEvent: created
playSoundToPlayer:vulture_ready.ogg
requireConditional:if self.customTarget1!=nullUnit
addWaypoint_type:move
addWaypoint_target_fromReference: customTarget1.readUnitMemory(name="rally",type="unit")

[hiddenAction_armour]
@copyFromSection:template_set_armour
@define armourUpgradeType: TerranVehicleArmor

[hiddenAction_speed]
autoTrigger: if self.globalTeamTags(includes='MachineShopThrusters') and not self.tags(includes='speed')
temporarilyAddTags: speed
setUnitStats: moveSpeed+=0.9908

[action_portrait]
unitShownInUI:portrait_vulture

[graphics]
image_offsetY:-6
total_frames:1
icon_build: vulture_icon.png
image:        vulture.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO_ANIMATED
lock_body_rotation_with_main_turret: false
showEnergyBar:false
drawLayer:experimentals
rotate_with_direction: false
animation_direction_units: 45
animation_direction_strideX:0
animation_direction_strideY:1
animation_direction_starting:180
frame_width:  70
frame_height: 60

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 10
turretTurnSpeed: 99
maxAttackRange: 200
shootDelay: 1.26s
showRangeUIGuide:true

[turret_null]
x: 0
y: 0
limitingRange:9999
canAttackCondition: if self.globalTeamTags(includes='GOVNO')
projectile:null
showRangeUIGuide:false

[projectile_null]
life:0
speed:0
invisible: true
directDamage: 0
explodeEffect:NONE
explodeEffectOnShield:NONE

[turret_T1T2]
showRangeUIGuide:false
canAttackCondition: if (self.resource(type='TerranVehicleAttack',equalTo=0) or self.resource(type='TerranVehicleAttack',equalTo=1)) and numberOfUnitsInNeutralTeam(withTag='disruptionWeb',withinRange=120,lessThan=1)
x: 0
y: 0
projectile:T1
shoot_sound:attack.ogg,attack2.ogg,attack3.ogg,attack4.ogg
shoot_sound_vol:0.3
recoilOffset: 0
shoot_flame:CUSTOM:cloud
altProjectile: T2
altProjectileCondition: if self.resource(type='TerranVehicleAttack',equalTo=1)

[turret_T3T4]
canAttackCondition: if (self.resource(type='TerranVehicleAttack',equalTo=2) or self.resource(type='TerranVehicleAttack',equalTo=3)) and numberOfUnitsInNeutralTeam(withTag='disruptionWeb',withinRange=120,lessThan=1)
@copyFromSection:turret_T1T2
projectile:T3
altProjectile: T4
altProjectileCondition: if self.resource(type='TerranVehicleAttack',equalTo=3)

[projectile_T1]
explodeEffect:CUSTOM:sparks
explodeEffectOnShield:CUSTOM:sparks
directDamage: 84
life: 160
speed: 5
targetSpeed: 7
image:bomb.png
mutator1_ifUnitWithTags:M
mutator1_ifUnitWithoutTags:haveShield
mutator1_directDamageMultiplier:0.5
mutator2_ifUnitWithTags:L, building
mutator2_ifUnitWithoutTags:haveShield
mutator2_directDamageMultiplier:0.25
mutator3_ifUnitWithTags: zergSwarm
mutator3_directDamageMultiplier:0
mutator4_ifUnitWithTags:hallucination
mutator4_directDamageMultiplier:2

[projectile_T2]
directDamage:86
@copyFromSection:projectile_T1

[projectile_T3]
directDamage:89
@copyFromSection:projectile_T1

[projectile_T4]
directDamage:92
@copyFromSection:projectile_T1

[movement]
movementType: LAND
moveSpeed: 1.7852
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.02
maxTurnSpeed: 40
turnAcceleration: 40
moveSlidingMode :false
moveIgnoringBody:false
reverseSpeedPercentage:0
joinsGroupFormations: false

[ai]
buildPriority: 0.8
noneInBaseExtraPriority: 0.8
noneGlobalExtraPriority: 0.8
maxEachBase: 10

[decal_ensnare_goo]
image:ROOT:/DATA/total/ensnare_goo_2.png

[decal_plague_goo]
image:ROOT:/DATA/total/plague_goo_2.png

[decal_defensive_matrix]
image:ROOT:/DATA/total/defensive_matrix_2.png

[decal_lockdown]
image:ROOT:/DATA/total/lockdown_2.png

[effect_mindControl]
image:ROOT:/DATA/total/mindControl_2.png
frame_width: 64
frame_height: 64

[hiddenAction_feedback_debuff]
@copyFrom_skipThisSection: true

[effect_feedback]
@copyFrom_skipThisSection: true

[hiddenAction_debuff_maelstrom]
@copyFrom_skipThisSection: true

[hiddenAction_debuff_maelstrom_effect]
@copyFrom_skipThisSection: true

[hiddenAction_removeDebuff_maelstrom]
@copyFrom_skipThisSection: true

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_med_grn.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_med_red.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_med_yell.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:10
image:ROOT:/DATA/total/hp_11.png
frame_width:34
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:23