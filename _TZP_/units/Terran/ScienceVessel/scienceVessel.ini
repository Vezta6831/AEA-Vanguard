[hiddenAction_armour]
@copyFromSection:template_set_armour
@define armourUpgradeType: TerranAirArmor

[hiddenAction_maxEnergy]
autoTrigger: if self.globalTeamTags(includes='TitanReactor') and self.maxEnergy!=250
temporarilyAddTags: maxEnergy
setUnitStats: maxEnergy=250

[hiddenAction_startingEnergy]
autoTriggerOnEvent:created
requireConditional: if self.globalTeamTags(includes='TitanReactor')
setUnitStats:energy=62

[action_defensiveMatrix]
isActive: if self.resource.lockdown<=0 and self.resource.stasis<=0 and memory.dMatrix==null
alwaysSinglePress:true
price:energy=100
displayType:infoOnly
buildSpeed:0s
text_ru:Защитная матрица
text:Defensive matrix
text_zh:防御矩阵
isGuiBlinking: if memory.dMatrix!=null
onlyOneUnitAtATime: true
fireTurretXAtGround:null
fireTurretXAtGround_withProjectile:null
ai_isDisabled: true
iconExtraColor:#FFFFFFFF
iconExtraImage:defensive_matrix_icon.png
addResources:energy=100
alsoTriggerAction:defensiveMatrix_2
alsoTriggerOrQueueActionConditional: if createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='ally') != nullUnit and createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='ally') != self

[hiddenAction_defensiveMatrix_2]
addWaypoint_type: touchTarget
clearAllWaypoints:true
addWaypoint_target_fromReference: createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='ally')
setUnitMemory: dMatrix=createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='ally')

[hiddenAction_defensiveMatrix_3]
autoTrigger: if memory.dMatrix!=nullUnit and memory.dMatrix.hp>0 and distanceBetween(self, memory.dMatrix)<=310 and self.energy>=100 and self.resource.lockdown<=0 and self.resource.stasis<=0
takeResources: d_matrix=-57
takeResources_discardCollected: true
takeResources_includeReference: unitRef memory.dMatrix
fireTurretXAtGround:null_2
fireTurretXAtGround_withProjectile:null
fireTurretXAtGround_withTarget: memory.dMatrix
playSoundAtUnit:defensiveMatrix.ogg:0.3
playAnimation:attack
stopLastAnimation:true
clearAllWaypoints:true
addResources:energy=-100
alsoTriggerAction:removeDefensiveMatrix

[hiddenAction_removeDefensiveMatrix]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional: if memory.dMatrix!=nullUnit
autoTrigger: if memory.dMatrix!=nullUnit and (self.energy<100 or memory.dMatrix.hp<=0)
setUnitMemory: dMatrix=null

[action_EMP]
isVisible: if self.globalTeamTags(includes='EMPupgrade')
isActive: if self.resource.lockdown<=0 and self.resource.stasis<=0 and memory.EMP==null
price:energy=100
displayType:infoOnly
buildSpeed:0s
text_ru:ЭМИ
text:EMP
text_zh:EMP
isGuiBlinking: if memory.EMP!=null
fireTurretXAtGround:null
fireTurretXAtGround_withProjectile:null
onlyOneUnitAtATime: true
ai_isDisabled: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Terran/emp.png
addResources:energy=100
setUnitMemory: EMP=thisActionTarget
addWaypoint_type: move
clearAllWaypoints:true
addWaypoint_target_fromReference: thisActionTarget

[hiddenAction_EMP_2]
autoTrigger: if memory.EMP!=nullUnit and distanceBetween(self, memory.EMP)<=310 and self.energy>=100 and self.resource.lockdown<=0 and self.resource.stasis<=0
fireTurretXAtGround:null_2
fireTurretXAtGround_withProjectile:EMP
fireTurretXAtGround_withTarget: memory.EMP
playSoundAtUnit:emp.ogg:0.4
stopLastAnimation:true
playAnimation:attack
clearAllWaypoints:true
addResources:energy=-100
setUnitMemory: EMP=null

[hiddenAction_removeEMP]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional: if memory.EMP!=nullUnit
autoTrigger: if memory.EMP!=nullUnit and self.energy<100
setUnitMemory: EMP=null

[action_irradiate]
isVisible: if self.globalTeamTags(includes='Radiation')
isActive: if self.resource.lockdown<=0 and self.resource.stasis<=0 and memory.irradiate==null
alwaysSinglePress:true
price:energy=75
displayType:infoOnly
buildSpeed:0s
text_ru:Облучение
text:Irradiate
text_zh:辐射
isGuiBlinking: if memory.irradiate!=null
onlyOneUnitAtATime: true
fireTurretXAtGround:null
fireTurretXAtGround_withProjectile:null
ai_isDisabled: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Terran/irradiate.png
addResources:energy=75
alsoTriggerAction:irradiate_2
alsoTriggerOrQueueActionConditional: if createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='any') != nullUnit and createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='any') != self

[hiddenAction_irradiate_2]
addWaypoint_type: touchTarget
clearAllWaypoints:true
addWaypoint_target_fromReference: createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='any')
setUnitMemory: irradiate=createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='any')

[hiddenAction_irradiate_3]
autoTrigger: if memory.irradiate!=nullUnit and memory.irradiate.hp>0 and distanceBetween(self, memory.irradiate)<=310 and self.energy>=75 and self.resource.lockdown<=0 and self.resource.stasis<=0
fireTurretXAtGround:null_2
fireTurretXAtGround_withProjectile:irradiate
fireTurretXAtGround_withTarget: memory.irradiate
playSoundAtUnit:irradiate.ogg:0.4
playAnimation:attack
stopLastAnimation:true
clearAllWaypoints:true
addResources:energy=-75
alsoTriggerAction:removeIrradiate

[hiddenAction_removeIrradiate]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional: if memory.irradiate!=nullUnit
autoTrigger: if memory.irradiate!=nullUnit and (self.energy<75 or memory.irradiate.hp<=0)
setUnitMemory: irradiate=null

[action_irradiate_ai]
alwaysSinglePress:true
price:energy=75
isVisible: if self.globalTeamTags(includes='Radiation') and self.isControlledByAI()
isActive: if self.globalTeamTags(includes='Radiation') and nearestUnit(withinRange=310, withTag='bio', relation='enemy') != nullUnit and self.resource.lockdown<=0 and self.resource.stasis<=0
displayType:infoOnly
buildSpeed:0s
text_ru:Облучение
text:Irradiate
onlyOneUnitAtATime: true
fireTurretXAtGround:null_2
fireTurretXAtGround_withProjectile:irradiate
fireTurretXAtGround_withTarget: nearestUnit(withinRange=320, withTag='bio', relation='enemy')
