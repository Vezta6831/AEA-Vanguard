[core]
copyFrom:ROOT:/DATA/total/forcesAttack.template, ROOT:/DATA/Terran/terranUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: dropshipSC
tags: mech,L,unit,vis17,gasCost, dropship
class: CustomUnitMetadata
price:Gas=100
maxHp: 1500
armour:1
mass: 500
displayText_ru: Транспортник
displayText: Dropship
displayText_zh:运输船
techLevel: 1
buildSpeed: 19s
#availableInDemo: true
radius: 22
displayRadius: 24
isBio: true
hideScorchMark: true
isBug: false
isUnrepairableUnit: false
softCollisionOnAll: 250
maxTransportingUnits:8
transportUnitsUnloadDelayBetweenEachUnit: 0.8s
exit_moveAwayAmount: 0
exitHeightIgnoreParent: true
exit_heightOffset: 0
explodeOnDeath: true
explodeOnDeathGroundCollosion: true
fogOfWarSightRange:17
effectOnDeath:CUSTOM:corpse
soundOnMoveOrder:dropship_yes.ogg:0.3,dropship_yes_1.ogg:0.3,dropship_yes_2.ogg:0.3,dropship_yes_3.ogg:0.3,dropship_yes_4.ogg:0.3
soundOnNewSelection:dropship_what.ogg:0.3,dropship_what_1.ogg:0.3,dropship_what_2.ogg:0.3,dropship_what_3.ogg:0.3

[action_unload]
isVisible: if self.transportingCount>0
isActive: if self.transportingCount>0
text_ru: Выгрузить
text: Unload
text_zh:空投
displayType:infoOnly
buildSpeed: 0s
highPriorityQueue: false
fireTurretXAtGround: null
fireTurretXAtGround_withProjectile:null
#onlyOneUnitAtATime: true
ai_isDisabled:true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/total/unload.png
addWaypoint_type: move
addWaypoint_target_fromReference: unitRef thisActionTarget
clearAllWaypoints: true
startUnloadingTransport:true

[action_loadUp]
isVisible: if not self.hasFlag(id=1)
isActive: if not self.hasFlag(id=1)
text_ru: Погрузить
text: LoadUp
text_zh:装载
displayType:infoOnly
buildSpeed: 0s
highPriorityQueue: false
fireTurretXAtGround: null
fireTurretXAtGround_withProjectile:null
#onlyOneUnitAtATime: true
ai_isDisabled:true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/total/loadUp.png
alsoTriggerAction:loadUp_2
alsoTriggerOrQueueActionConditional: if thisActionTarget.nearestUnit(withinRange=25, relation='any') != nullUnit and not thisActionTarget.nearestUnit(withinRange=25, relation='any').isFlying()

[hiddenAction_loadUp_2]
addWaypoint_type: loadUp
addWaypoint_target_fromReference: unitRef thisActionTarget.nearestUnit(withinRange=25, relation='any')
addWaypoint_target_nearestUnit_team: own
clearAllWaypoints: true

[hiddenAction_loadUp_moveToTarget]
autoTriggerOnEvent: newMessage(withTag="moveTransport")
addWaypoint_type: touchTarget
addWaypoint_target_fromReference: eventSource
clearAllWaypoints:true

[action_unload_slot1]
@define slotId: 0
alwaysSinglePress:true
isVisible: if transporting(slot=${slotId})!=nullUnit
isActive: if not self.isOverwater() and not self.isOverLiquid() and not self.isOverClift() and transporting(slot=${slotId})!=nullUnit
forceUnloadTransportNow: true
forceUnloadTransportNow_onlyOnSlot: ${slotId}
addActionCooldownTime: 0.8s
addActionCooldownApplyToActions: unload_slot1, unload_slot2, unload_slot3, unload_slot4, unload_slot5, unload_slot6, unload_slot7, unload_slot8
price: 0
text: [
textAddUnitName: unitRef self.transporting(slot=${slotId})
textPostFix: ]
unitShownInUI: unitRef self.transporting(slot=${slotId})
displayType:infoOnly
buildSpeed: 0s
highPriorityQueue: true
ai_isDisabled:true

[action_unload_slot2]
@define slotId: 1
@copyFromSection: action_unload_slot1

[action_unload_slot3]
@define slotId: 2
@copyFromSection: action_unload_slot1

[action_unload_slot4]
@define slotId: 3
@copyFromSection: action_unload_slot1

[action_unload_slot5]
@define slotId: 4
@copyFromSection: action_unload_slot1

[action_unload_slot6]
@define slotId: 5
@copyFromSection: action_unload_slot1

[action_unload_slot7]
@define slotId: 6
@copyFromSection: action_unload_slot1

[action_unload_slot8]
@define slotId: 7
@copyFromSection: action_unload_slot1

[turret_null]
x: 0
y: 0
limitingRange:9999
canShoot: false
showRangeUIGuide:false

[projectile_null]
life:0
speed:0
directDamage: 0
targetGround: true
explodeEffect:NONE

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 90
alpha: 9
image:ROOT:/DATA/Terran/units/death.png
priority: critical
drawUnderUnits:false
animateFrameStart:0
animateFrameEnd:8
animateFrameSpeed:0.2
alsoPlaySound:death.wav
frame_width:  128
frame_height: 128

[hiddenAction_soundOnLoad]
autoTriggerOnEvent: transportingNewUnit
playSoundAtUnit: ROOT:/DATA/Terran/units/load.ogg:0.4

[hiddenAction_soundOnUnload]
autoTriggerOnEvent: transportUnloadedOrRemovedUnit
playSoundAtUnit: ROOT:/DATA/Terran/units/unload.ogg:0.4

[hiddenAction_soundOnCreate]
autoTriggerOnEvent: created
playSoundToPlayer: dropship_ready.ogg
requireConditional:if self.customTarget1!=nullUnit
addWaypoint_type:move
addWaypoint_target_fromReference: customTarget1.readUnitMemory(name="rally",type="unit")

[hiddenAction_armour]
@copyFromSection:template_set_armour
@define armourUpgradeType: TerranAirArmor

[action_portrait]
unitShownInUI:portrait_dropship

[graphics]
image_offsetY:-14
total_frames: 2
icon_build: dropship_icon.png
image:        dropship.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO_ANIMATED
animation_moving_start: 1
animation_moving_end: 2
animation_moving_speed: 2.5
showTransportBar:false
showEnergyBar:false
lock_body_rotation_with_main_turret: true
rotate_with_direction: false
animation_direction_units: 45
animation_direction_strideX:3
animation_direction_strideY:0
animation_direction_starting:180
frame_width:  68
frame_height: 68

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange:0

[movement]
movementType: AIR
moveSpeed: 1.628
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.02
maxTurnSpeed: 40
turnAcceleration: 40
reverseSpeedPercentage:0
joinsGroupFormations: false
slowDeathFall: false
startingHeightOffset: 35

[ai]
useAsTransport: true
buildPriority: 0.8
noneInBaseExtraPriority: 0.8
noneGlobalExtraPriority: 0.8
maxGlobal: 5

[decal_ensnare_goo]
image:ROOT:/DATA/total/ensnare_goo_2.png

[decal_acidSpores]
image:ROOT:/DATA/total/acidSpores_M.png
frame_width:34
frame_height:34

[decal_plague_goo]
image:ROOT:/DATA/total/plague_goo_2.png

[decal_defensive_matrix]
image:ROOT:/DATA/total/defensive_matrix_2.png

[decal_lockdown]
image:ROOT:/DATA/total/lockdown_2.png

[effect_mindControl]
image:ROOT:/DATA/total/mindControl_2.png
frame_width: 64
frame_height: 64

[hiddenAction_feedback_debuff]
@copyFrom_skipThisSection: true

[effect_feedback]
@copyFrom_skipThisSection: true

[hiddenAction_debuff_maelstrom]
@copyFrom_skipThisSection: true

[hiddenAction_debuff_maelstrom_effect]
@copyFrom_skipThisSection: true

[hiddenAction_removeDebuff_maelstrom]
@copyFrom_skipThisSection: true

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_med_grn.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_med_red.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_med_yell.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:10
image:ROOT:/DATA/total/hp_11.png
frame_width:34
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:23