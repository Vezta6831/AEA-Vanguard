[core]
copyFrom:ROOT:/DATA/Zerg/units/meleeUnits.template, ROOT:/DATA/Zerg/units/burrow.template, ROOT:/DATA/Zerg/zergUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: infTerran
tags:S,bio,canConsume,unit,vis17,groundUnit
price:Minerals=100,Gas=50,supply=1, displaySupply=-1
borrowResourcesWhileAlive:supply=1, displaySupply=-1
maxHp: 60
mass: 100
displayText_ru: Зараженный терран
displayText_zh:自爆人
displayText: Infected terran
buildSpeed: 25s
radius: 12
displayRadius: 14
explodeOnDeath: false
effectOnDeath:CUSTOM:corpse
soundOnAttackOrder:infTerran_yes_1.ogg:0.3,infTerran_yes_2.ogg:0.3,infTerran_yes_3.ogg:0.3,infTerran_yes_4.ogg:0.3
soundOnMoveOrder:infTerran_yes_1.ogg:0.3,infTerran_yes_2.ogg:0.3,infTerran_yes_3.ogg:0.3,infTerran_yes_4.ogg:0.3
soundOnNewSelection:infTerran_what_1.ogg:0.3,infTerran_what_2.ogg:0.3,infTerran_what_3.ogg:0.3,infTerran_what_4.ogg:0.3

[hiddenAction_soundOnCreate]
autoTriggerOnEvent: created
requireConditional:if self.customTarget1!=nullUnit
playSoundToPlayer:infTerran_ready.wav
addWaypoint_type:move
addWaypoint_target_fromReference: customTarget1.readUnitMemory(name="rally",type="unit")

[action_burrow]
setBodyRotation: 45

[hiddenAction_burrow_2]
convertTo: InfestedTerranUnderGround
buildSpeed: 0.25s
whenBuilding_rotateTo:45
convertTo_keepCurrentFields: armour

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 80
alpha: 8
image: death.png
priority: critical
drawUnderUnits: true
total_frames:8
animateFrameStart:0
animateFrameEnd:7
animateFrameSpeed:0.2
alsoPlaySound:death.wav

[effect_attack]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 10
hSpeed: 0
yOffsetAbsolute: -10
image: explode.png
priority: critical
drawUnderUnits:false
total_frames:10
animateFrameStart:0
animateFrameEnd:9
animateFrameSpeed:0.3
alsoPlaySound:death.wav
frame_width:  80
frame_height: 80

[hiddenAction_kill]
autoTrigger: false
deleteSelf: true

[action_portrait]
unitShownInUI:portrait_infestedTerran

[graphics]
image_offsetY:-11
icon_build: infestedTerran_icon.png
image:        infestedTerran.png
image_wreak:  dead.png
image_turret: NONE
image_shadow:NONE
animation_moving_start: 0
animation_moving_end: 7
animation_moving_speed: 3
drawLayer:experimentals
lock_body_rotation_with_main_turret: true
rotate_with_direction: false
animation_direction_units: 45
animation_direction_strideX:0
animation_direction_strideY:1
animation_direction_starting:180
frame_width:  64
frame_height: 64

[attack]
maxAttackRange: 10
turretSize:12
shootDelay: 2s

[turret_1]
x: 0
y: 0
onShoot_triggerActions: kill
shoot_flame:CUSTOM:attack

[projectile_1]
areaDamage: 500
areaRadius:40
areaDamageNoFalloff: true
friendlyFire:true
life: 0
speed: 0
invisible: true
explodeOnEndOfLife: true
explodeEffect:NONE
mutator1_ifUnitWithTags:M
mutator1_ifUnitWithoutTags:haveShield
mutator1_areaDamageMultiplier:0.75
mutator2_ifUnitWithTags:S
mutator2_ifUnitWithoutTags:haveShield
mutator2_areaDamageMultiplier:0.5
mutator3_ifUnitWithTags: stasis, building
mutator3_areaDamageMultiplier:0
mutator4_ifUnitWithTags:hallucination
mutator4_areaDamageMultiplier:2
spawnProjectilesOnCreate: building_1

[projectile_building_1]
explodeEffect:NONE
directDamage: 500
life:10
instant:true
invisible: true
mutator1_ifUnitWithoutTags: building
mutator1_directDamageMultiplier:0
mutator2_ifUnitWithTags: stasis
mutator2_directDamageMultiplier:0

[movement]
moveSpeed: 1.7856
slowDeathFallSmoke: false
slowDeathFall: false

[animation_burrow]
body_0s: {frame:4}
body_0.05s: {frame:3}
body_0.1s: {frame:2}
body_0.15s: {frame:1}
body_0.2s: {frame:0}
body_0.25s: {frame:0}

[hiddenAction_feedback_debuff]
@copyFrom_skipThisSection: true

[effect_feedback]
@copyFrom_skipThisSection: true

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_smll_grn.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_smll_red.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_smll_yell.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:5
image:ROOT:/DATA/total/hp_6.png
frame_width:19
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:14