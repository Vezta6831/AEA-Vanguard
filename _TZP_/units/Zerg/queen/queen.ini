[turret_broodling]
canOnlyAttackUnitsWithoutTags:NotBroodling,building
x: 0
y: 0
shoot_sound:shoot.ogg
shoot_sound_vol:0.3
shoot_flame:NONE
resourceUsage:broodling=1, energy=150
showRangeUIGuide:false
projectile:broodling
canAttackCondition: if self.resource.broodling>0
onShoot_freezeBodyMovementFor:0.6s

[projectile_broodling]
directDamage: 600
spawnUnit: broodling*2
life: 160
speed: 5
targetSpeed: 12
image:arrow.png
explodeEffect:NONE
buildingDamageMultiplier: 0
autoTargetingOnDeadTarget: true

[turret_infest]
x: 0
y: 0
limitingRange:9999
showRangeUIGuide:false

[movement]
moveSpeed: 1.9852

[resource_broodling]
hidden:false

[resource_infest]
hidden:false

