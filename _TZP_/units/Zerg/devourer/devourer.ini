[core]
copyFrom:ROOT:/DATA/Zerg/units/airUnits.template, ROOT:/DATA/Zerg/zergUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: devourer
overrideAndReplace: heavyInterceptor
tags:L,bio,canConsume,unit,vis17
price:Minerals=100,Gas=100
borrowResourcesWhileAlive:supply=2, displaySupply=-2
maxHp: 250
armour:2
displayText_ru: Пожиратель
displayText: Devourer
displayText_zh:吞噬者
buildSpeed: 25s
radius: 24
displayRadius: 26
soundOnMoveOrder: devourer_yes_1.ogg:0.3,devourer_yes_2.ogg:0.3,devourer_yes_3.ogg:0.3,devourer_yes_4.ogg:0.3
soundOnAttackOrder: devourer_yes_1.ogg:0.3,devourer_yes_2.ogg:0.3,devourer_yes_3.ogg:0.3,devourer_yes_4.ogg:0.3
soundOnNewSelection:devourer_what_1.ogg:0.3,devourer_what_2.ogg:0.3,devourer_what_3.ogg:0.3

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 90
alpha: 9
hSpeed: 0
image: death.png
priority: critical
drawUnderUnits:false
total_frames:9
animateFrameStart:0
animateFrameEnd:8
animateFrameSpeed:0.2
alsoPlaySound:death.ogg
scaleFrom:1
scaleTo: 1

[effect_sparks2]
alwayStartDirAtZero:true
attachedToUnit: false
life: 50
alpha: 7
hSpeed: 0
image: spark.png
priority: critical
drawUnderUnits:false
total_frames:10
animateFrameStart:0
animateFrameEnd:9
animateFrameSpeed:0.2
scaleFrom:1
scaleTo: 1

[action_portrait]
unitShownInUI:portrait_devourer

[graphics]
image_offsetY:-10
total_frames: 10
icon_build: devourer_icon.png
image:        devourer.png
image_shadow: AUTO_ANIMATED
animation_moving_start: 0
animation_moving_end: 5
animation_moving_speed: 3
animation_idle_start: 0
animation_idle_end: 5
animation_idle_speed: 3
animation_attack_start: 6
animation_attack_end: 9
animation_attack_speed: 3
showEnergyBar:false
showShotDelayBar:false
lock_body_rotation_with_main_turret: true
rotate_with_direction: false
animation_direction_units: 45
animation_direction_strideX:0
animation_direction_strideY:1
animation_direction_starting:180
frame_width:  72
frame_height: 85

[attack]
canAttackLandUnits:false
maxAttackRange: 240
shootDelay: 4.2s

[turret_T1T2]
canAttackFlyingUnits: if self.resource(type='ZergAirAttack',equalTo=0) or self.resource(type='ZergAirAttack',equalTo=1)
canAttackLandUnits: false
x: 0
y: 0
shoot_sound:shoot.ogg
shoot_sound_vol:0.3
recoilOffset: 0
projectile:T1
barrelHeight: 10
showRangeUIGuide:false
altProjectile: T2
altProjectileCondition: if self.resource(type='ZergAirAttack',equalTo=1)

[turret_T3T4]
canAttackFlyingUnits: if self.resource(type='ZergAirAttack',equalTo=2) or self.resource(type='ZergAirAttack',equalTo=3)
@copyFromSection:turret_T1T2
projectile:T3
altProjectile: T4
altProjectileCondition: if self.resource(type='ZergAirAttack',equalTo=3)

[projectile_T1]
directDamage: 25
areaDamage: 0
areaRadius:40
areaDamageNoFalloff: true
life: 160
speed: 4
targetSpeed: 8
image:arrow.png
explodeEffect:CUSTOM:sparks2
explodeEffectOnShield:CUSTOM:sparks2
mutator1_ifUnitWithTags:M
mutator1_ifUnitWithoutTags:haveShield
mutator1_directDamageMultiplier:0.75
mutator2_ifUnitWithTags:S
mutator2_ifUnitWithoutTags:haveShield
mutator2_directDamageMultiplier:0.5
mutator3_ifUnitWithTags: stasis
mutator3_directDamageMultiplier:0
mutator4_ifUnitWithoutTags:building
mutator4_addResourcesAreaHit:acidSpores=50
mutator5_ifUnitWithTags:hallucination
mutator5_directDamageMultiplier:2

[projectile_T2]
directDamage: 27
@copyFromSection:projectile_T1

[projectile_T3]
directDamage: 29
@copyFromSection:projectile_T1

[projectile_T4]
directDamage: 31
@copyFromSection:projectile_T1

[movement]
moveSpeed: 1.488

[decal_ensnare_goo]
image:ROOT:/DATA/total/ensnare_goo_3.png

[decal_acidSpores]
image:ROOT:/DATA/total/acidSpores_L.png
frame_width:58
frame_height:58

[decal_plague_goo]
image:ROOT:/DATA/total/plague_goo_3.png

[decal_defensive_matrix]
image:ROOT:/DATA/total/defensive_matrix_3.png

[effect_mindControl]
image:ROOT:/DATA/total/mindControl_3.png
frame_width: 128
frame_height: 128

[hiddenAction_feedback_debuff]
@copyFrom_skipThisSection: true

[effect_feedback]
@copyFrom_skipThisSection: true

[decal_maelstrom]
image:ROOT:/DATA/total/maelstrom_3.png
frame_width:  128
frame_height: 128

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_med_grn_2.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_med_red_2.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_med_yell_2.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:10
image:ROOT:/DATA/total/hp_11.png
frame_width:34
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:23