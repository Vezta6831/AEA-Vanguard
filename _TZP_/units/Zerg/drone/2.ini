[core]
copyFrom:ROOT:/DATA/Zerg/units/undergroundUnits.template, ROOT:/DATA/Zerg/zergUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: DroneUnderGround
tags:S,bio,invis,undergroundZerg,canConsume,unit,vis6
canOnlyBeAttackedByUnitsWithTags:massWeapons
maxHp: 40
displayText_ru: Рабочий
displayText_zh:工蜂
displayText: Drone
displayRadius: 10
soundOnNewSelection:droneOrder1.ogg:0.3,droneOrder2.ogg:0.3,droneOrder3.ogg:0.3
showOnMinimapToEnemies: false

[hiddenAction_burrow_2]
convertTo: drone
buildSpeed: 0.25s
whenBuilding_rotateTo:45
whenBuilding_temporarilyConvertTo: DroneUnderGround2
convertTo_keepCurrentFields: armour
whenBuilding_temporarilyConvertTo_keepFields: armour

[hiddenAction_detect]
autoTrigger: if self.queueSize<=0 and (numberOfUnitsInEnemyTeam(withTag='detector',withinRange=320)>0 or numberOfUnitsInEnemyTeam(withTag='detectorRange',withinRange=440)>0 or self.resource.d_matrix>0 or self.resource.maelstrom>0 or self.resource.stasis>0 or self.resource.ensnare>0 or self.resource.plague>0)
convertTo: DroneUnderGround2
convertTo_keepCurrentFields: armour

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 80
alpha: 8
image: death.png
priority: critical
drawUnderUnits: true
total_frames:8
animateFrameStart:0
animateFrameEnd:7
animateFrameSpeed:0.2
alsoPlaySound:death.ogg

[action_portrait]
unitShownInUI:portrait_drone

[graphics]
isVisibleToEnemies: false
image_offsetY:-3
total_frames: 5
icon_build: drone_icon.png
image: burrow.png
image_wreak:  dead.png
animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 120
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_attack_start: 0
animation_attack_end: 0
animation_attack_speed: 6
drawLayer:experimentals
showEnergyBar: false
lock_body_rotation_with_main_turret: true
rotate_with_direction: false

[animation_burrow]
body_0s: {frame:0}
body_0.05s: {frame:1}
body_0.1s: {frame:2}
body_0.15s: {frame:3}
body_0.2s: {frame:4}
body_0.25s: {frame:4}

[resource_chrysalis]
hidden:true

[resource_khaydarin]
hidden:true

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_smll_grn.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_smll_red.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_smll_yell.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:5
image:ROOT:/DATA/total/hp_6.png
frame_width:19
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:14