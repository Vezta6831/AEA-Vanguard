[core]
copyFrom:ROOT:/DATA/Zerg/units/meleeUnits.template, ROOT:/DATA/Zerg/zergUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: ultralisk
tags:L,bio,canConsume,unit,vis17,groundLargeUnit
price:Minerals=200,Gas=200,supply=4, displaySupply=-4
borrowResourcesWhileAlive:supply=4, displaySupply=-4
maxHp: 400
armour:1
mass: 9999
displayText_ru: Ультралиск
displayText: Ultralisk
displayText_zh:雷兽
buildSpeed: 38s
radius: 26
displayRadius: 28
transportSlotsNeeded: 4
soundOnMoveOrder: ultralisk_yes_1.ogg:0.3,ultralisk_yes_2.ogg:0.3,ultralisk_yes_3.ogg:0.3,ultralisk_yes_4.ogg:0.3
soundOnAttackOrder: ultralisk_yes_1.ogg:0.3,ultralisk_yes_2.ogg:0.3,ultralisk_yes_3.ogg:0.3,ultralisk_yes_4.ogg:0.3
soundOnNewSelection:ultralisk_what_1.ogg:0.3,ultralisk_what_2.ogg:0.3,ultralisk_what_3.ogg:0.3,ultralisk_what_4.ogg:0.3
@memory ChitinousPlating:boolean

[hiddenAction_soundOnCreate]
autoTriggerOnEvent: created
requireConditional:if self.customTarget1!=nullUnit
playSoundToPlayer:ultralisk_ready.ogg
addWaypoint_type:move
addWaypoint_target_fromReference: customTarget1.readUnitMemory(name="rally",type="unit")

[hiddenAction_speed]
autoTrigger: if self.globalTeamTags(includes='AnabolicSynthesis') and not self.tags(includes='speed')
temporarilyAddTags: speed
setUnitStats: moveSpeed+=0.82

[hiddenAction_armour]
autoTrigger: if ((memory.armour!=self.resource.${armourUpgradeType}) or (self.globalTeamTags(includes='ChitinousPlating') and not memory.ChitinousPlating)) and self.shield<${minShield}
setUnitStats: armour=${core.armour}+self.resource.${armourUpgradeType}+select(self.globalTeamTags(includes='ChitinousPlating'),2,0)
setUnitMemory: armour=self.resource.${armourUpgradeType}, ChitinousPlating=select(self.globalTeamTags(includes='ChitinousPlating'),true,false)

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 50
alpha: 4
image: death.png
priority: critical
drawUnderUnits: true
total_frames:4
animateFrameStart:0
animateFrameEnd:3
animateFrameSpeed:0.2
alsoPlaySound:death.wav

[action_portrait]
unitShownInUI:portrait_ultralisk

[graphics]
image_offsetY:-7
icon_build: ultralisk_icon.png
image:       ultralisk.png
image_wreak:  dead.png
image_turret: NONE
image_shadow:NONE
animation_moving_start: 0
animation_moving_end: 9
animation_moving_speed: 3
animation_attack_start: 10
animation_attack_end: 14
animation_attack_speed: 5
lock_body_rotation_with_main_turret: true
drawLayer:experimentals
rotate_with_direction: false
animation_direction_units: 45
animation_direction_strideX:15
animation_direction_strideY:0
animation_direction_starting:180
frame_width:  108
frame_height: 108

[attack]
shootDelay: 0.63s
turretSize:28

[turret_T1T2]
canAttackCondition: if (self.resource(type='ZergMeleeAttack',equalTo=0) or self.resource(type='ZergMeleeAttack',equalTo=1)) and numberOfUnitsInNeutralTeam(withTag='disruptionWeb',withinRange=120)<=0
x: 0
y: 0
shoot_sound:attack.wav,attack2.wav,attack3.wav
shoot_sound_vol:0.3
recoilOffset: 0
projectile:T1
showRangeUIGuide:false
onShoot_freezeBodyMovementFor:0.6s
altProjectile: T2
altProjectileCondition: if self.resource(type='ZergMeleeAttack',equalTo=1)

[turret_T3T4]
canAttackCondition: if (self.resource(type='ZergMeleeAttack',equalTo=2) or self.resource(type='ZergMeleeAttack',equalTo=3)) and numberOfUnitsInNeutralTeam(withTag='disruptionWeb',withinRange=120)<=0
@copyFromSection:turret_T1T2
projectile:T3
altProjectile: T4
altProjectileCondition: if self.resource(type='ZergMeleeAttack',equalTo=3)

[projectile_T1]
directDamage: 20
life: 10
instant:true
invisible: true
explodeEffect:NONE
mutator1_ifUnitWithTags:hallucination
mutator1_directDamageMultiplier:2

[projectile_T2]
directDamage: 23
@copyFromSection:projectile_T1

[projectile_T3]
directDamage: 26
@copyFromSection:projectile_T1

[projectile_T4]
directDamage: 29
@copyFromSection:projectile_T1

[movement]
moveSpeed: 1.64

[decal_ensnare_goo]
image:ROOT:/DATA/total/ensnare_goo_3.png

[decal_plague_goo]
image:ROOT:/DATA/total/plague_goo_3.png

[decal_defensive_matrix]
image:ROOT:/DATA/total/defensive_matrix_3.png

[effect_mindControl]
image:ROOT:/DATA/total/mindControl_3.png
frame_width: 128
frame_height: 128

[hiddenAction_debuff_ensnare]
setUnitStats: moveSpeed=${movement.moveSpeed}*0.5, shootDelayMultiplier=1.01

[hiddenAction_feedback_debuff]
@copyFrom_skipThisSection: true

[effect_feedback]
@copyFrom_skipThisSection: true

[decal_maelstrom]
image:ROOT:/DATA/total/maelstrom_3.png
frame_width:  128
frame_height: 128

[decal_stasis]
image:ROOT:/DATA/total/stasis_2.png
frame_width: 128
frame_height: 128

[effect_restoration]
image:ROOT:/DATA/total/restoration_2.png
frame_width: 128
frame_height: 128

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_grn.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_lrg_red.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_yell.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:16
image:ROOT:/DATA/total/hp_17.png
frame_width:52
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:26