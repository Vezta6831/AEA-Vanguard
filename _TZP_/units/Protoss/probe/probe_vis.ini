[core]
copyFrom:probe.ini
showInEditor:false
name: probe_vis

[hiddenAction_arbiter_cloak]
autoTrigger: if numberOfUnitsInTeam(withTag='arbiter',withinRange=220)==0
convertTo:probe
playSoundAtUnit:ROOT:/DATA/total/cloaking_2.ogg:0.4

[hiddenAction_detect]
autoTrigger: if numberOfUnitsInEnemyTeam(withTag='detector',withinRange=320)==0 and numberOfUnitsInEnemyTeam(withTag='detectorRange',withinRange=440)==0 and self.resource.lockdown==0 and self.resource.d_matrix==0 and self.resource.stasis==0 and self.resource.ensnare==0 and self.resource.plague==0 and self.resource.acidSpores==0
convertTo:probe_invis
convertTo_keepCurrentFields: armour
playSoundAtUnit:ROOT:/DATA/total/cloaking.ogg:0.4

[graphics]
image: probe_invis.png
image_shadow: NONE

[ai]
upgradedFrom: probe

[decal_mineral]
alpha:0.5

[decal_gas]
alpha:0.5