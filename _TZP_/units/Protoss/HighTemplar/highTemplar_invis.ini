[core]
copyFrom:highTemplar.ini
showInEditor:false
name: highTemplar_invis
canOnlyBeAttackedByUnitsWithTags:massWeapons
showOnMinimapToEnemies: false

[hiddenAction_arbiter_cloak]
autoTrigger: if numberOfUnitsInTeam(withTag='arbiter',withinRange=220)==0
convertTo:highTemplar_vis
playSoundAtUnit:ROOT:/DATA/total/cloaking_2.ogg:0.4

[hiddenAction_detect]
autoTrigger: if numberOfUnitsInEnemyTeam(withTag='detector',withinRange=320)>0 or numberOfUnitsInEnemyTeam(withTag='detectorRange',withinRange=440)>0 or self.resource.lockdown>0 or self.resource.d_matrix>0 or self.resource.stasis>0 or self.resource.ensnare>0 or self.resource.plague>0 or self.resource.acidSpores>0
convertTo:highTemplar_vis
convertTo_keepCurrentFields: armour
playSoundAtUnit:ROOT:/DATA/total/cloaking_2.ogg:0.4

[graphics]
isVisibleToEnemies: false
image: highTemplar_invis.png
image_shadow: NONE

[ai]
upgradedFrom: highTemplar

[decal_trail]
alpha:0.5

[decal_trail_2]
alpha:0.5