body_0.2s: {frame:6}

[decal_hallucination_texture]
@copyFromSection: template_hallucination_texture
@define totalFrames:13
image: highTemplar_illusion.png

[decal_hallucination_energy]
@define totalFrames:7
image:ROOT:/DATA/total/energy_7.png
frame_width:22
frame_height:5
yOffsetAbsolute:21

[decal_trail]
@define dir0: (self.dir>=-22.5 and self.dir<=22.5)
@define dir45: (self.dir>=22.5 and self.dir<=67.5)
@define dir90: (self.dir>=67.5 and self.dir<=112.5)
@define dir135: (self.dir>=112.5 and self.dir<=157.5)
@define dir180: ((self.dir>=157.5 and self.dir<=180) or (self.dir<=-157.5 and self.dir>=-180))
@define dir225: (self.dir<=-112.5 and self.dir>=-157.5)
@define dir270: (self.dir<=-67.5 and self.dir>=-112.5)
@define dir315: (self.dir<=-22.5 and self.dir>=-67.5)
@define totalFrames:4
isVisible: if memory.trail_frame<=${trail_maxFrames} and self.y<=memory.trail_pos.y+1.5
layer: afterBody
image: highTemplar_trail.png
frame_width: 42
frame_height:42
onlyOnNonPreview:true
alwaysStartDirAtZero:true
onlyWhileAlive:true
teamColors:false
yOffsetAbsolute:${graphics.image_offsetY}
frame: (select(${dir0},4,select(${dir45},5,select(${dir90},6,select(${dir135},7,select(${dir180},0,select(${dir225},1,select(${dir270},2,select(${dir315},3,0))))))))*${totalFrames})+memory.trail_frame
basePosition:memory.trail_pos

[decal_trail_2]
@copyFromSection: decal_trail
isVisible: if memory.trail_frame<=${trail_maxFrames} and self.y>memory.trail_pos.y+1.5
layer: beforeBody

[hiddenAction_debuff_lockdown]
@copyFrom_skipThisSection: true

[hiddenAction_removeDebuff_lockdown]
@copyFrom_skipThisSection: true

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_smll_grn.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_smll_red.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_smll_yell.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:6
image:ROOT:/DATA/total/hp_p7.png
frame_width:22
frame_height:7
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:14

[decal_shield]
@copyFromSection: template_customBar
@define totalFrames:6
image:ROOT:/DATA/total/shield_p7.png
frame_width:22
frame_height:7
frame:int((self.shield*100/self.maxShield)/(100/${totalFrames}))
yOffsetAbsolute:14

[decal_energy]
@copyFromSection: template_customBar
@define totalFrames:7
isVisible: if self.maxEnergy>0
onlyWhenSelectedByOwnPlayer:true
onlyWhenSelectedByAnyPlayer:false
image:ROOT:/DATA/total/energy_7.png
frame_width:22
frame_height:5
frame:int((self.energy*100/self.maxEnergy)/(100/${totalFrames}))
yOffsetAbsolute:21