[core]
copyFrom:ROOT:/DATA/total/forcesAttack.template, ROOT:/DATA/Protoss/protossUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: archont
tags: L, NotBroodling, hover, unit,vis17,groundLargeUnit, canBeHallucinated
class: CustomUnitMetadata
price:Gas=4500
maxHp:2000
maxShield:14000
shieldRegen:0.35
shieldDisplayOnlyDeflection:true
mass: 9999
displayText: Archon
displayText_zh:执政官
displayText_ru: Архон
techLevel: 1
buildSpeed: 50s
#availableInDemo: true
radius: 26
hideScorchMark: false
displayRadius: 30
isBio: true
isBug: false
isUnrepairableUnit: true
softCollisionOnAll: 5
transportSlotsNeeded: 4
fogOfWarSightRange:17
effectOnDeath:NONE
soundOnMoveOrder:archon_yes.ogg:0.3,archon_yes_1.ogg:0.3,archon_yes_2.ogg:0.3,archon_yes_3.ogg:0.3
soundOnAttackOrder:archon_yes.ogg:0.3,archon_yes_1.ogg:0.3,archon_yes_2.ogg:0.3,archon_yes_3.ogg:0.3
soundOnNewSelection:archon_what.ogg:0.3,archon_what_1.ogg:0.3,archon_what_2.ogg:0.3,archon_what_3.ogg:0.3

@global hallucinationUnit:archont
@global supplyAdd:4

[hiddenAction_onDestroyed_nonHallucination]
spawnEffects:CUSTOM:corpse

[hiddenAction_Recall]
autoTrigger: if numberOfUnitsInTeam(withTag='recall',withinRange=100,greaterThan=0) and nearestUnit(withinRange=120, withTag='recall', relation='own').customTarget1!=nullUnit
clearAllWaypoints: true
teleportTo: nearestUnit(withinRange=120, withTag='recall', relation='own').customTarget1

[effect_spark]
alwayStartDirAtZero:true
attachedToUnit: false
life: 60
alpha: 6
image: spark.png
priority: critical
drawUnderUnits:false
total_frames:6
animateFrameStart:0
animateFrameEnd:5
animateFrameSpeed:0.2

[effect_light]
attachedToUnit: true
xOffsetRelative: 24
yOffsetRelative: 10
life: 60
alpha: 6
image:light.png
priority: critical
drawUnderUnits:false
total_frames:4
animateFrameStart:0
animateFrameEnd:3
animateFrameSpeed:0.15

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 10
image: ROOT:/DATA/Protoss/death.png
priority: critical
drawUnderUnits: true
total_frames:10
animateFrameStart:0
animateFrameEnd:9
animateFrameSpeed:0.2
frame_width:  190
frame_height: 152
alsoPlaySound:dead.ogg

[hiddenAction_armour]
@copyFromSection:template_set_shieldArmour
@define armourUpgradeType: ProtossGroundArmor

[hiddenAction_arbiter_cloak]
autoTrigger: if numberOfUnitsInTeam(withTag='arbiter',withinRange=220)>0 and self.resource.hallucination==0
convertTo:archont_vis
convertTo_keepCurrentFields: armour
playSoundAtUnit:ROOT:/DATA/total/cloaking.ogg:0.4

[action_portrait]
unitShownInUI:portrait_archon

[graphics]
image_offsetY:-12
total_frames: 11
icon_build: archon_icon.png
image:        archont.png
image_wreak:  NONE
image_turret: NONE
image_shadow:NONE
animation_attack_start: 5
animation_attack_end: 10
animation_attack_speed: 5
drawLayer:experimentals
lock_body_rotation_with_main_turret: true
rotate_with_direction: false
animation_direction_units: 45
animation_direction_strideX:0
animation_direction_strideY:1
animation_direction_starting:180
frame_width:  84
frame_height: 91

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
meleeEngangementDistance: 200
isMelee:true
isFixedFiring: true
turretSize: 6
aimOffsetSpread: 0
turretTurnSpeed: 3
maxAttackRange: 80
shootDelay: 0.84s
showRangeUIGuide:true

[turret_T1T2]
canAttackCondition: if (self.resource(type='ProtossGroundAttack',equalTo=0) or self.resource(type='ProtossGroundAttack',equalTo=1)) and numberOfUnitsInNeutralTeam(withTag='disruptionWeb',withinRange=120)<=0
x: 0
y: 0
shoot_sound:attack.ogg
shoot_sound_vol:0.3
recoilOffset:0
barrelHeight: 10
shoot_flame:CUSTOM:light
projectile:T1
showRangeUIGuide:false
onShoot_freezeBodyMovementFor:0.63s
altProjectile: T2
altProjectileCondition: if self.resource(type='ProtossGroundAttack',equalTo=1)

[turret_T3T4]
canAttackCondition: if (self.resource(type='ProtossGroundAttack',equalTo=2) or self.resource(type='ProtossGroundAttack',equalTo=3)) and numberOfUnitsInNeutralTeam(withTag='disruptionWeb',withinRange=120)<=0
@copyFromSection:turret_T1T2
projectile:T3
altProjectile: T4
altProjectileCondition: if self.resource(type='ProtossGroundAttack',equalTo=3)

[projectile_T1]
directDamage: 190
areaDamage:275
areaRadius:67
life: 10
invisible: true
instant: true
areaDamageNoFalloff: false
explodeEffect:CUSTOM:spark
explodeEffectOnShield:CUSTOM:spark
mutator1_ifUnitWithTags: zergSwarm
mutator1_areaDamageMultiplier:0.25
mutator2_ifUnitWithTags: stasis
mutator2_areaDamageMultiplier:0
mutator3_ifUnitWithTags:hallucination
mutator3_areaDamageMultiplier:2
spawnProjectilesOnCreate: T1_darkSwarm

[projectile_T2]
directDamage: 200
areaDamage:275
spawnProjectilesOnCreate: T2_darkSwarm
@copyFromSection:projectile_T1

[projectile_T3]
directDamage: 210
areaDamage:285
spawnProjectilesOnCreate: T3_darkSwarm
@copyFromSection:projectile_T1

[projectile_T4]
directDamage: 220
areaDamage:295
spawnProjectilesOnCreate: T4_darkSwarm
@copyFromSection:projectile_T1

[projectile_T1_darkSwarm]
explodeEffect:NONE
directDamage:${projectile_T1.areaDamage}
invisible: true
life: 20
instant: true
mutator1_ifUnitWithTags: zergSwarm
mutator1_directDamageMultiplier:0.25
mutator2_ifUnitWithTags: stasis
mutator2_directDamageMultiplier:0
mutator3_ifUnitWithoutTags: zergSwarm
mutator3_directDamageMultiplier:0
mutator4_ifUnitWithTags:hallucination
mutator4_directDamageMultiplier:2

[projectile_T2_darkSwarm]
directDamage:${projectile_T2.areaDamage}
@copyFromSection:projectile_T1_darkSwarm

[projectile_T3_darkSwarm]
directDamage:${projectile_T3.areaDamage}
@copyFromSection:projectile_T1_darkSwarm

[projectile_T4_darkSwarm]
directDamage:${projectile_T4.areaDamage}
@copyFromSection:projectile_T1_darkSwarm

[movement]
movementType: LAND
moveSpeed: 0.98
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.02
maxTurnSpeed: 40
turnAcceleration: 40
reverseSpeedPercentage:0
joinsGroupFormations: false

[ai]
buildPriority: 0.8
noneInBaseExtraPriority: 0.8
noneGlobalExtraPriority: 0.8
maxEachBase: 10

[animation_idle]
onActions: idle,move
body_0s: {frame:0}
body_0.4s: {frame:4}
body_0.5s: {frame:4}

[decal_hallucination_energy]
@define totalFrames:12
image:ROOT:/DATA/total/energy_12.png
frame_width:37
frame_height:5
yOffsetAbsolute:36

[decal_ensnare_goo]
image:ROOT:/DATA/total/ensnare_goo_3.png

[decal_plague_goo]
image:ROOT:/DATA/total/plague_goo_3.png

[decal_defensive_matrix]
image:ROOT:/DATA/total/defensive_matrix_3.png

[hiddenAction_debuff_lockdown]
@copyFrom_skipThisSection: true

[hiddenAction_removeDebuff_lockdown]
@copyFrom_skipThisSection: true

[effect_mindControl]
image:ROOT:/DATA/total/mindControl_3.png
frame_width: 128
frame_height: 128

[hiddenAction_feedback_debuff]
@copyFrom_skipThisSection: true

[effect_feedback]
@copyFrom_skipThisSection: true

[hiddenAction_debuff_maelstrom]
@copyFrom_skipThisSection: true

[hiddenAction_debuff_maelstrom_effect]
@copyFrom_skipThisSection: true

[hiddenAction_removeDebuff_maelstrom]
@copyFrom_skipThisSection: true

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_grn.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_lrg_red.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_yell.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:11
image:ROOT:/DATA/total/hp_p12.png
frame_width:37
frame_height:7
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:29

[decal_shield]
@copyFromSection: template_customBar
@define totalFrames:11
image:ROOT:/DATA/total/shield_p12.png
frame_width:37
frame_height:7
frame:int((self.shield*100/self.maxShield)/(100/${totalFrames}))
yOffsetAbsolute:29

[decal_sparks]
@define frameStart: 0
@define totalFrames:15
@define framesPerSec: 12
image:sparks.png
onlyOnNonPreview:true
alwaysStartDirAtZero:true
teamColors:true
yOffsetAbsolute:-13
frame_width:  120
frame_height: 120
frame: ${frameStart}+self.timeAlive*${framesPerSec}%${totalFrames}
onlyWhileAlive: true

[decal_sparks_hallucination]
@copyFromSection: decal_sparks
isVisible: if self.resource.hallucination>0
image:sparks_illusion.png
onlyTeam:ally