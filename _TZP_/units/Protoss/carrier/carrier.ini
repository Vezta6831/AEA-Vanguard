[core]
copyFrom:ROOT:/DATA/total/forcesAttack.template, ROOT:/DATA/Protoss/protossUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: carrier
tags:L,carrier,mech,unit,vis17,canBeHallucinated
class: CustomUnitMetadata
price:Minerals=350,Gas=250,supply=6,displaySupply=-6
borrowResourcesWhileAlive: supply=6,displaySupply=-6
maxHp: 300
maxShield:150
shieldRegen:0.01
shieldDisplayOnlyDeflection:true
armour:4
mass: 99999
displayText: Carrier
displayText_zh:航母
displayText_ru: Авианосец
techLevel: 1
buildSpeed: 88s
energyMax: 1
energyRegen: 0.016666666
radius: 44
displayRadius: 46
exit_x:0
exit_y:0
exit_moveAwayAmount:-30
isBio: true
hideScorchMark: true
isBug: false
fogOfWarSightRange:17
isUnrepairableUnit: true
softCollisionOnAll: 250
explodeOnDeath: true
explodeOnDeathGroundCollosion: true
soundOnMoveOrder:carrier_yes.ogg:0.3,carrier_yes_1.ogg:0.3,carrier_yes_2.ogg:0.3,carrier_yes_3.ogg:0.3
soundOnAttackOrder:carrier_yes.ogg:0.3,carrier_yes_1.ogg:0.3,carrier_yes_2.ogg:0.3,carrier_yes_3.ogg:0.3
soundOnNewSelection:carrier_what.ogg:0.3,carrier_what_1.ogg:0.3,carrier_what_2.ogg:0.3,carrier_what_3.ogg:0.3
effectOnDeath:NONE
maxTransportingUnits: 8
transportUnitsCanUnloadUnits: false
transportUnitsAddUnloadOption: false
transportUnitsRequireTag: interceptor
transportUnitsRequireMovementType: air
transportUnitsKeepBuiltUnits: true

@global hallucinationUnit:carrier
@global supplyAdd:6

[hiddenAction_onDestroyed_nonHallucination]
spawnEffects:CUSTOM:corpse

[hiddenAction_soundOnCreate]
autoTriggerOnEvent: created
playSoundToPlayer:carrier_ready.ogg:0.3
requireConditional:if self.customTarget1!=nullUnit and customTarget1.tags(includes="building")
addWaypoint_type:move
addWaypoint_target_fromReference: customTarget1.readUnitMemory(name="rally",type="unit")

[hiddenAction_onCreate]
autoTriggerOnEvent:created
addResources: interceptor=4

[hiddenAction_Recall]
autoTrigger: if numberOfUnitsInTeam(withTag='recall',withinRange=100,greaterThan=0) and nearestUnit(withinRange=120, withTag='recall', relation='own').customTarget1!=nullUnit
clearAllWaypoints: true
teleportTo: nearestUnit(withinRange=120, withTag='recall', relation='own').customTarget1

[action_interceptor]
text_ru:Перехватчик
text:Interceptor
text_zh:拦截机
price: Gas=100, interceptor=1
displayType:queueUnit
buildSpeed: 13s
isVisible: if (self.resource(type='interceptor')>0 or self.queueSize>0) and self.resource.hallucination==0
isActive: if self.resource(type='interceptor')>0 and self.resource.lockdown<=0 and self.resource.stasis<=0
isLocked: if self.queueSize>4
isLockedMessage_ru:Нельзя заказать больше 5 юнитов
isLockedMessage_zh:队列已达上限
isLockedMessage:You can not order greater than 5 units
produceUnits: interceptor
iconExtraColor:#FFFFFFFF
iconExtraImage:interceptor_icon.png
ai_isDisabled: true

[hiddenAction_autoInterceptor]
requireConditional: if self.resource(type='Minerals')>=25
autoTrigger: if self.queueSize<=0 and self.resource(type='interceptor')>0 and self.isControlledByAI() and self.resource.hallucination==0
alsoQueueAction: interceptor
addResources: Minerals=-25, interceptor=-1

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 10
image: ROOT:/DATA/Protoss/death.png
priority: critical
drawUnderUnits:false
total_frames:10
animateFrameStart:0
animateFrameEnd:9
animateFrameSpeed:0.2
frame_width:  190
frame_height: 152
alsoPlaySound:dead.ogg

[hiddenAction_armour]
@copyFromSection:template_set_shieldArmour
@define armourUpgradeType: ProtossAirArmor

[hiddenAction_capacity]
autoTrigger: if self.globalTeamTags(includes='CarrierCapacity') and not self.tags(includes='capacity')
temporarilyAddTags: capacity
addResources: interceptor=4

[hiddenAction_arbiter_cloak]
autoTrigger: if numberOfUnitsInTeam(withTag='arbiter',withinRange=220)>0 and self.resource.hallucination==0
convertTo:carrier_vis
convertTo_keepCurrentFields: armour
playSoundAtUnit:ROOT:/DATA/total/cloaking.ogg:0.4

[action_portrait]
unitShownInUI:portrait_carrier

[graphics]
image_offsetY:-20
total_frames: 2
icon_build: carrier_icon.png
image:        carrier.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO_ANIMATED
animation_moving_start: 1
animation_moving_end: 1
animation_moving_speed: 4
showTransportBar: false
showEnergyBar: false
lock_body_rotation_with_main_turret: true
rotate_with_direction: false
animation_direction_units: 45
animation_direction_strideX:2
animation_direction_strideY:0
animation_direction_starting:180
frame_width:  128
frame_height: 128

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
maxAttackRange:320
isFixedFiring: true
aimOffsetSpread: 0
shootDelay: 0.25s
turretSize:12
turretTurnSpeed:3
showRangeUIGuide:false
turretMultiTargeting: true

[turret_1]
x: 0
y: 0
recoilOffset:0
shoot_sound:launch.wav
shoot_sound_vol:0.3
projectile:null
warmup: 0.5s
showRangeUIGuide:false
canAttackCondition: if self.transportingCount(greaterThan=0)
unloadUpToXUnitsAndGiveAttackOrder: 8

[turret_2]
x: 0
y: 0
recoilOffset:0
projectile:null
showRangeUIGuide:false
canAttackCondition: if self.transportingCount(lessThan=1)

[projectile_null]
directDamage: 0
life: 0
speed: 0
invisible: true
explodeEffect:NONE
explodeEffectOnShield:NONE

[movement]
movementType: AIR
moveSpeed: 0.9912
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.02
maxTurnSpeed: 40
turnAcceleration: 40
reverseSpeedPercentage:0
joinsGroupFormations: false
slowDeathFall: false
startingHeightOffset: 35

[ai]
buildPriority: 0.9
noneInBaseExtraPriority: 0.9
noneGlobalExtraPriority: 0.9
maxEachBase: 10

[resource_interceptor]
displayName_ru:Перехватчик
displayName:Interceptor
hidden:true

