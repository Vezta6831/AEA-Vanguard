[core]
copyFrom:darkTemplarInvis.ini
showInEditor: false
name: darkTemplarVis
showOnMinimapToEnemies: true
canOnlyBeAttackedByUnitsWithTags:IGNORE

[hiddenAction_detect]
@copyFrom_skipThisSection:true
autoTrigger: if numberOfUnitsInEnemyTeam(withTag='detector',withinRange=320)<1 and numberOfUnitsInEnemyTeam(withTag='detectorRange',withinRange=440)<1 and self.resource.d_matrix<=0 and self.resource.maelstrom<=0 and self.resource.stasis<=0 and self.resource.ensnare<=0 and self.resource.plague<=0 and self.resource.hallucination==0
convertTo:darkTemplarInvis
convertTo_keepCurrentTags: true
convertTo_keepCurrentFields: armour
playSoundAtUnit:ROOT:/DATA/total/cloaking.ogg:0.4

[graphics]
isVisibleToEnemies: true