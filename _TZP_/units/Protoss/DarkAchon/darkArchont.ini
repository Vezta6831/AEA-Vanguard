@copyFrom_skipThisSection: true

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_grn.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_lrg_red.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_yell.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:11
image:ROOT:/DATA/total/hp_p12.png
frame_width:37
frame_height:7
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:29

[decal_shield]
@copyFromSection: template_customBar
@define totalFrames:11
image:ROOT:/DATA/total/shield_p12.png
frame_width:37
frame_height:7
frame:int((self.shield*100/self.maxShield)/(100/${totalFrames}))
yOffsetAbsolute:29

[decal_energy]
@copyFromSection: template_customBar
@define totalFrames:12
isVisible: if self.maxEnergy>0
onlyWhenSelectedByOwnPlayer:true
onlyWhenSelectedByAnyPlayer:false
image:ROOT:/DATA/total/energy_12.png
frame_width:37
frame_height:5
frame:int((self.energy*100/self.maxEnergy)/(100/${totalFrames}))
yOffsetAbsolute:36

[decal_sparks]
@define frameStart: 0
@define totalFrames:15
@define framesPerSec: 12
image:sparks.png
onlyOnNonPreview:true
alwaysStartDirAtZero:true
teamColors:true
yOffsetAbsolute:-13
frame_width:  120
frame_height: 120
frame: ${frameStart}+self.timeAlive*${framesPerSec}%${totalFrames}
onlyWhileAlive: true

[decal_sparks_hallucination]
@copyFromSection: decal_sparks
isVisible: if self.resource.hallucination>0
image:sparks_illusion.png
onlyTeam:ally