[core]
copyFrom:ROOT:/DATA/total/forcesAttack.template, ROOT:/DATA/Protoss/protossUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/total/customUI.template, ROOT:/DATA/total/unit_portrait.template
name: darkArchont
tags: L, NotBroodling, haveEnergy, hover,unit,vis17, groundLargeUnit,canBeHallucinated
class: CustomUnitMetadata
price:Minerals:100,Gas:300
borrowResourcesWhileAlive:supply=4,displaySupply=-4
maxHp:10
maxShield:350
shieldRegen:0.01
shieldDisplayOnlyDeflection:true
energyMax:200
energyRegen:0.0124
mass: 9999
displayText_ru: Тёмный архон
displayText: Dark archon
displayText_zh:黑暗执政官
techLevel: 1
buildSpeed: 13s
#availableInDemo: true
radius: 26
hideScorchMark: true
displayRadius: 30
isBio: true
isBug: false
isUnrepairableUnit: true
softCollisionOnAll: 5
transportSlotsNeeded: 4
fogOfWarSightRange:17
effectOnDeath:NONE
soundOnMoveOrder:dArchon_yes.ogg:0.3,dArchon_yes_1.ogg:0.3,dArchon_yes_2.ogg:0.3,dArchon_yes_3.ogg:0.3
soundOnAttackOrder:dArchon_yes.ogg:0.3,dArchon_yes_1.ogg:0.3,dArchon_yes_2.ogg:0.3,dArchon_yes_3.ogg:0.3
soundOnNewSelection:dArchon_what.ogg:0.3,dArchon_what_1.ogg:0.3,dArchon_what_2.ogg:0.3,dArchon_what_3.ogg:0.3

@memory mindControl:unit
@memory feedback:unit
@memory maelstrom:unit
@global hallucinationUnit:darkArchont
@global supplyAdd:4

[hiddenAction_onDestroyed_nonHallucination]
spawnEffects:CUSTOM:corpse

[hiddenAction_Recall]
autoTrigger: if numberOfUnitsInTeam(withTag='recall',withinRange=100,greaterThan=0) and nearestUnit(withinRange=120, withTag='recall', relation='own').customTarget1!=nullUnit
clearAllWaypoints: true
teleportTo: nearestUnit(withinRange=120, withTag='recall', relation='own').customTarget1

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 160
alpha: 16
image:death.png
priority: critical
drawUnderUnits: true
total_frames:15
animateFrameStart:0
animateFrameEnd:14
animateFrameSpeed:0.2
frame_width:  160
frame_height: 160
alsoPlaySound:dead.ogg

[effect_maelHit]
alwayStartDirAtZero:true
attachedToUnit: false
life: 80
alpha: 8
image:maelHit.png
priority: critical
drawUnderUnits: false
total_frames:9
animateFrameStart:0
animateFrameEnd:8
animateFrameSpeed:0.2
frame_width:  128
frame_height: 128

[hiddenAction_armour]
@copyFromSection:template_set_shieldArmour
@define armourUpgradeType: ProtossGroundArmor

[hiddenAction_maxEnergy]
autoTrigger: if self.globalTeamTags(includes='ArgusTalisman') and self.maxEnergy!=250 and self.resource.hallucination==0
temporarilyAddTags: maxEnergy
setUnitStats: maxEnergy=250

[hiddenAction_arbiter_cloak]
autoTrigger: if numberOfUnitsInTeam(withTag='arbiter',withinRange=220)>0 and self.resource.hallucination==0
convertTo:darkArchont_vis
convertTo_keepCurrentFields: armour
playSoundAtUnit:ROOT:/DATA/total/cloaking.ogg:0.4

[action_mindControl]
isVisible: if self.globalTeamTags(includes='MindControl') and self.resource.hallucination==0
isActive: if self.resource.stasis<=0 and memory.mindControl==null
alwaysSinglePress:true
price:energy=150
displayType:infoOnly
buildSpeed:0s
text_ru:Подчинение
text:Mind control
text_zh:心灵控制
isGuiBlinking: if memory.mindControl!=null
onlyOneUnitAtATime: true
fireTurretXAtGround:null
fireTurretXAtGround_withProjectile:null
ai_isDisabled: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Protoss/mindControl.png
addResources:energy=150
alsoTriggerAction:mindControl_2
alsoTriggerOrQueueActionConditional: if createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='enemy') != nullUnit

[hiddenAction_mindControl_2]
addWaypoint_type: touchTarget
clearAllWaypoints:true
addWaypoint_target_fromReference: createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='enemy')
setUnitMemory: mindControl=createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='unit', relation='enemy')

[hiddenAction_mindControl_3]
autoTrigger: if memory.mindControl!=nullUnit and memory.mindControl.hp>0 and distanceBetween(self, memory.mindControl)<=310 and self.energy>=150 and self.resource.stasis<=0
sendMessageTo: memory.mindControl
sendMessageWithTags:MindControl
playSoundAtUnit:mindControl.ogg:0.4
clearAllWaypoints:true
addResources:energy=-150,shield=-999
alsoTriggerAction:removeMindControl

[hiddenAction_removeMindControl]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional: if memory.mindControl!=nullUnit
autoTrigger: if memory.mindControl!=nullUnit and (self.energy<150 or memory.mindControl.hp<=0)
setUnitMemory: mindControl=null

[action_feedback]
isVisible: if self.resource.hallucination==0
isActive: if self.resource.stasis<=0 and memory.feedback==null
alwaysSinglePress:true
price:energy=100
displayType:infoOnly
buildSpeed:0s
text_ru:Противодействие
text:Feedback
text_zh:反馈
isGuiBlinking: if memory.feedback!=null
onlyOneUnitAtATime: true
fireTurretXAtGround:null
fireTurretXAtGround_withProjectile:null
ai_isDisabled: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Protoss/feedbackIcon.png
addResources:energy=100
alsoTriggerAction:feedback_2
alsoTriggerOrQueueActionConditional: if createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='haveEnergy', relation='enemy') != nullUnit and not createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='haveEnergy', relation='enemy').tags(includes="building")

[hiddenAction_feedback_2]
addWaypoint_type: touchTarget
clearAllWaypoints:true
addWaypoint_target_fromReference: createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='haveEnergy', relation='enemy')
setUnitMemory: feedback=createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withinRange=40, withTag='haveEnergy', relation='enemy')

[hiddenAction_feedback_3]
autoTrigger: if memory.feedback!=nullUnit and memory.feedback.hp>0 and distanceBetween(self, memory.feedback)<=310 and self.energy>=100 and self.resource.stasis<=0
sendMessageTo: memory.feedback
sendMessageWithTags:Feedback
playSoundAtUnit:feedback.ogg:0.4
clearAllWaypoints:true
addResources:energy=-100
alsoTriggerAction:removeFeedback

[hiddenAction_removeFeedback]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional: if memory.feedback!=nullUnit
autoTrigger: if memory.feedback!=nullUnit and (self.energy<100 or memory.feedback.hp<=0)
setUnitMemory: feedback=null

[action_maelstrom]
isVisible: if self.globalTeamTags(includes='Maelstrom') and self.resource.hallucination==0
isActive: if self.resource.stasis<=0 and memory.maelstrom==null
price:energy=100
displayType:infoOnly
buildSpeed:0s
text_ru:Водоворот
text:Maelstorm
text_zh:黑暗漩涡
isGuiBlinking: if memory.maelstrom!=null
fireTurretXAtGround:null
fireTurretXAtGround_withProjectile:null
onlyOneUnitAtATime: true
ai_isDisabled: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Protoss/maelstrom_icon.png
addResources:energy=100
setUnitMemory: maelstrom=thisActionTarget
addWaypoint_type: move
clearAllWaypoints:true
addWaypoint_target_fromReference: thisActionTarget

[hiddenAction_maelstrom_2]
autoTrigger: if memory.maelstrom!=nullUnit and distanceBetween(self, memory.maelstrom)<=310 and self.energy>=100 and self.resource.stasis<=0
fireTurretXAtGround:null_2
fireTurretXAtGround_withProjectile:maelstrom
fireTurretXAtGround_withTarget: memory.maelstrom
clearAllWaypoints:true
playSoundAtUnit:maelstrom.ogg:0.4
addResources:energy=-100
setUnitMemory: maelstrom=null

[hiddenAction_removeMaelstrom]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional: if memory.maelstrom!=nullUnit
autoTrigger: if memory.maelstrom!=nullUnit and self.energy<100
setUnitMemory: maelstrom=null

[action_portrait]
unitShownInUI:portrait_darkArchon

