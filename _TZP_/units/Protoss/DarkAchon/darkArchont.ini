body_0.4s: {frame:4}
body_0.5s: {frame:4}

[decal_hallucination_texture]
@copyFromSection: template_hallucination_texture
@define totalFrames:5
xOffsetAbsolute:-2
image: darkArchon_illusion.png

[decal_hallucination_energy]
