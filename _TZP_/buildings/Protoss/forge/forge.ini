[core]
copyFrom:ROOT:/DATA/total/baseAttack.template, ROOT:/DATA/Protoss/protossUpgrades.template, ROOT:/DATA/Protoss/buildings.template, ROOT:/DATA/total/customUI.template
name: Forge
tags:Forge,building,vis17
class: CustomUnitMetadata
price: 0
maxHp: 1400
maxShield:1000
shieldRegen:0.12
shieldDisplayOnlyDeflection:true
mass: 9000
armour:1
hideScorchMark: false
fogOfWarSightRange:17
displayText_ru:Оружейная
displayText:Forge
displayText_zh:锻炉
footprint: -2,-2,2,1
constructionFootprint:-2,-2,2,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0
techLevel: 1
buildSpeed: 1
selfBuildRate: 1
radius: 60
isBuilder: true
nanoRange: 0
isBuilding: true
isBio: false
numBitsOnDeath: 12
isUnrepairableUnit:true
soundOnNewSelection:Forge.ogg:0.3
effectOnDeath: CUSTOM:corpse

[decal_light]
@copyFromSection: template_light
image:forge_light.png
frame_width:160
frame_height:128
yOffsetAbsolute:0

[decal_fire]
@copyFromSection: template_fire
isVisible: if self.hp<self.maxHp*0.85
image:ROOT:/DATA/Protoss/fire2.png
frame: select(self.hp<self.maxHp*0.75,12,0)+(self.timeAlive*12%12)
xOffsetAbsolute:20
yOffsetAbsolute:-4

[decal_fire_2]
@copyFromSection: template_fire
isVisible: if self.hp<self.maxHp*0.65
image:ROOT:/DATA/Protoss/fire.png
frame: select(self.hp<self.maxHp*0.55,12,0)+(self.timeAlive*12%12)
xOffsetAbsolute:22
yOffsetAbsolute:-43

[decal_fire_3]
@copyFromSection: template_fire
isVisible: if self.hp<self.maxHp*0.50
image:ROOT:/DATA/Protoss/fire3.png
frame: select(self.hp<self.maxHp*0.40,12,0)+(self.timeAlive*12%12)
xOffsetAbsolute:-19
yOffsetAbsolute:10

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 10
image: ROOT:/DATA/Protoss/death.png
alsoPlaySound:ROOT:/DATA/total/buildingExplode.wav
priority: critical
drawUnderUnits:false
total_frames:10
animateFrameStart:0
animateFrameEnd:9
animateFrameSpeed:0.2
frame_width:  190
frame_height: 152

[action_clear]
isVisible:true
isActive:true
displayType:infoOnly
buildSpeed:0s
price:0
text_ru:Уничтожить
text:Delete
text_zh:自毁
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/total/delete.png
addResources:hp=-100,shield=-100
ai_isDisabled:true

[hiddenAction_notWorking]
autoTrigger: if not self.hasUnitInTeam(withTag='pylon',withinRange=300) and self.tags(includes='Forge')
temporarilyRemoveTags:Forge
refundAllQueuedItems:true

[hiddenAction_Working]
autoTrigger: if self.hasUnitInTeam(withTag='pylon',withinRange=300) and not self.tags(includes='Forge')
temporarilyAddTags:Forge

[action_attackT2]
@define upgradeLevel:1
isVisible: if self.resource.ProtossGroundAttack==${upgradeLevel-1}
isActive: if self.resource.ProtossGroundAttack==${upgradeLevel-1} and self.hasUnitInTeam(withTag='pylon',withinRange=300)
buildSpeed:${148+20*upgradeLevel}s
displayType: queueUnit
text_zh:升级
text_ru:Улучшение
text: Upgrade
description_ru:Наземное оружие\n След. уровень: ${upgradeLevel}\n Увеличивает урон Зилотов, Драгунов, Тёмных тамплиеров и Архонов
description:Ground weapons\n Next level: ${upgradeLevel}\n Increases the attack damage of Zealots, Dragoons, Dark templars and Archons
description_zh:地面武器\n 下一级别：${upgradeLevel}\n增加狂热者、龙骑士、黑暗圣堂武士和执政官的攻击伤害
price:Minerals=${50+50*upgradeLevel},Gas=${50+50*upgradeLevel}
playSoundToPlayer:ROOT:/DATA/Protoss/upgrade.ogg:0.5
onlyOneUnitAtATime: true
iconExtraImage:groundAttack.png
iconExtraColor: #FFFFFFFF
allowMultipleInQueue:false
ai_isHighPriority:true
whenBuilding_playAnimation:build
setResourcesWithLogic: ProtossGroundAttack=${upgradeLevel}

[action_attackT3]
@copyFromSection: action_attackT2
@define upgradeLevel:2
isLocked: if not self.hasUnitInTeam(withTag='TemplarArchive')
isLockedMessage:Requires:\n  >Templar archives
