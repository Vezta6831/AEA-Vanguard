[core]
copyFrom:ROOT:/DATA/total/baseAttack.template, ROOT:/DATA/Terran/terranUpgrades.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/Terran/buildings.template, ROOT:/DATA/total/customUI.template
name: Armory
tags: Armory,building,mech,vis17,gasCost
class: CustomUnitMetadata
price:0
maxHp: 2600
mass: 9000
armour:2
hideScorchMark: false
fogOfWarSightRange:17
displayText_ru:Оружейная
displayText:Armory
displayText_zh:军械库
footprint: -2,-2,2,1
constructionFootprint:-2,-2,2,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0
techLevel: 1
buildSpeed: 1
radius: 60
isBuilder: true
nanoRange: 0
isBuilding: true
isBio: false
numBitsOnDeath: 12
isUnrepairableUnit:false
effectOnDeath:CUSTOM:corpse
soundOnNewSelection:Armory.ogg:0.3

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 120
alpha: 12
image:ROOT:/DATA/Terran/death.png
alsoPlaySound:ROOT:/DATA/total/buildingExplode.wav
priority: critical
drawUnderUnits:false
animateFrameStart:0
animateFrameEnd:11
animateFrameSpeed:0.2
frame_width:  252
frame_height: 200

[action_clear]
isVisible:true
isActive:true
displayType:infoOnly
buildSpeed:1s
price:0
text_ru:Уничтожить
text:Delete
text_zh:自毁
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/total/delete.png
addResources:hp=-100
ai_isDisabled:true

[action_attackT2]
@define upgradeLevel:1
isVisible: if self.resource.TerranVehicleAttack==${upgradeLevel-1}
isActive: if self.resource.TerranVehicleAttack==${upgradeLevel-1}
displayType: queueUnit
price:Minerals=${25+75*upgradeLevel},Gas=${25+75*upgradeLevel}
text_ru: Улучшение
text: Upgrade
text_zh:升级
description_ru:Машинное оружие\n След. уровень: ${upgradeLevel}\n Увеличивает урон Голиафов, Стервятников и Танков
description:Vehicle weapons\n Next level: ${upgradeLevel}\n Increases the attack damage of Goliaths, Vultures and Tanks
description_zh:车辆武器\n 下一级别：${upgradeLevel}\n增加歌莉娅、秃鹫战车和坦克的攻击伤害
buildSpeed: ${148+20*upgradeLevel}s
highPriorityQueue: true
iconExtraColor:#FFFFFFFF
iconExtraImage:vehicleAttack.png
playSoundToPlayer:ROOT:/DATA/Terran/upgrade.ogg:0.4
onlyOneUnitAtATime: true
allowMultipleInQueue:false
ai_isHighPriority:true
whenBuilding_playAnimation:build
setResourcesWithLogic: TerranVehicleAttack=${upgradeLevel}

