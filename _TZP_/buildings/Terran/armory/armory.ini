[ai]
buildPriority: 0.09
noneInBaseExtraPriority: 0.09
noneGlobalExtraPriority: 0.09
maxEachBase: 2
maxGlobal: 2
recommendedInEachBaseNum: 1
upgradedFrom: ArmoryBuild

[animation_build]
body_0s: {frame:0}
body_0.1s: {frame:1}
body_0.2s: {frame:2}
body_0.3s: {frame:3}
