[core]
copyFrom:ROOT:/DATA/total/baseAttack.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/Terran/buildings.template, ROOT:/DATA/total/customUI.template
name: CovertOps
tags: CovertOps,building,COps,mech,vis8,gasCost
class: CustomUnitMetadata
price:0
maxHp: 1800
mass: 9000
armour:1
hideScorchMark: false
fogOfWarSightRange:8
displayText_ru:Отдел спецопераций
displayText:Covert ops
displayText_zh:谍报中心
footprint: -1,-1,1,1
constructionFootprint:-1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:2
exit_x:0
exit_y:40
techLevel: 1
buildSpeed: 1
radius: 40
buildingSelectionOffset: -8
isBuilder: true
nanoRange: 0
isBuilding: true
isBio: true
numBitsOnDeath: 12
isUnrepairableUnit:false
effectOnDeath:CUSTOM:corpse
@memory connectionFrame:float
updateUnitMemory: connectionFrame=select(self.getOffsetAbsolute(x=-90,y=-20).self.hasUnitInTeam(withTag="ScienceFacility",withinRange=10) and self.getOffsetAbsolute(x=-90,y=-20).nearestUnit(withTag="ScienceFacility",withinRange=10,relation="own").z==self.z and memory.connectionFrame<4, memory.connectionFrame+1, select((not self.getOffsetAbsolute(x=-90,y=-20).self.hasUnitInTeam(withTag="ScienceFacility",withinRange=10) or self.getOffsetAbsolute(x=-90,y=-20).nearestUnit(withTag="ScienceFacility",withinRange=10,relation="own").z!=self.z) and memory.connectionFrame>0, memory.connectionFrame-1, memory.connectionFrame))
updateUnitMemoryRate:0.1s

[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 120
alpha: 12
image:ROOT:/DATA/Terran/death.png
alsoPlaySound:ROOT:/DATA/total/buildingExplode.wav
priority: critical
drawUnderUnits:false
animateFrameStart:0
animateFrameEnd:11
animateFrameSpeed:0.2
frame_width:  252
frame_height: 200

[action_clear]
isVisible:true
isActive:true
displayType:infoOnly
buildSpeed:0s
price:0
text_ru:Уничтожить
text:Delete
text_zh:自毁
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/total/delete.png
addResources:hp=-100
ai_isDisabled:true

[action_cloaking]
isVisible: if ((self.getOffsetAbsolute(x=-90,y=-20).self.hasUnitInTeam(withTag="ScienceFacility",withinRange=10) and not self.isControlledByAI()) or (self.hasUnitInTeam(withTag="ScienceFacility", withinRange=100) and self.isControlledByAI())) and not self.globalTeamTags(includes='CoverOpsGhost')
buildSpeed:50s
displayType: queueUnit
text_ru:Улучшение
text:Upgrade
text_zh:升级
description_ru:Маскирующее поле\n Делает Призрака невидимым для вражеских юнитов, пока рядом не окажется детектор
description:Personnel cloaking\n Makes the Ghost invisible to enemies unless revealed by a detector
description_zh:隐形服\n让敌人看不见幽灵，除非被探测器发现
price:Gas:475
playSoundToPlayer:ROOT:/DATA/Terran/research.ogg:0.4
onlyOneUnitAtATime: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Terran/cloak.png
allowMultipleInQueue:false
addGlobalTeamTags:CoverOpsGhost
ai_isHighPriority:true
whenBuilding_playAnimation:build

[action_lockdown]
isVisible: if ((self.getOffsetAbsolute(x=-90,y=-20).self.hasUnitInTeam(withTag="ScienceFacility",withinRange=10) and not self.isControlledByAI()) or (self.hasUnitInTeam(withTag="ScienceFacility", withinRange=100) and self.isControlledByAI())) and not self.globalTeamTags(includes='GhostLockdown')
buildSpeed:100s
displayType: queueUnit
text_ru:Улучшение
text_zh:升级
text:Upgrade
description_ru:Замыкание\n Призрак отключает вражеских механических или роботизированных юнитов
description:Lockdown\n The ghost disables enemy mechanical or robotic units
description_zh:锁定\n幽灵使敌人的机械单位瘫痪
price:Gas:500
playSoundToPlayer:ROOT:/DATA/Terran/research.ogg:0.4
onlyOneUnitAtATime: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Terran/lockdown_icon.png
allowMultipleInQueue:false
addGlobalTeamTags:GhostLockdown
ai_isHighPriority:true
whenBuilding_playAnimation:build

[action_ocularImplants]
isVisible: if ((self.getOffsetAbsolute(x=-90,y=-20).self.hasUnitInTeam(withTag="ScienceFacility",withinRange=10) and not self.isControlledByAI()) or (self.hasUnitInTeam(withTag="ScienceFacility", withinRange=100) and self.isControlledByAI())) and not self.globalTeamTags(includes='OcularImplants')
buildSpeed:105s
displayType: queueUnit
text_ru:Улучшение
text:Upgrade
text_zh:升级
description_ru:Глазные импланты\n Увеличивает радиус обзора и дальность использования ядерного удара для Призраков
description:Ocular implants\n Increases a Ghost's sight range and maximum casting range for a nuclear strike
description_zh:眼部植入\n增加幽灵的视野范围和核打击的最大施法距离
price:Gas:350
playSoundToPlayer:ROOT:/DATA/Terran/research.ogg:0.4
onlyOneUnitAtATime: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ocularImplants.png
allowMultipleInQueue:false
addGlobalTeamTags: OcularImplants
ai_isHighPriority:true
whenBuilding_playAnimation:build

[action_moebiusReactor]
isVisible: if ((self.getOffsetAbsolute(x=-90,y=-20).self.hasUnitInTeam(withTag="ScienceFacility",withinRange=10) and not self.isControlledByAI()) or (self.hasUnitInTeam(withTag="ScienceFacility", withinRange=100) and self.isControlledByAI())) and not self.globalTeamTags(includes='MoebiusReactor')
buildSpeed:105s
displayType: queueUnit
text_ru:Улучшение
text:Upgrade
text_zh:升级
description_ru:Реактор Мёбиус\n Увеличивает максимальный запас энергии Призрака с 200 до 250 (+50) и начальную энергию на 12
description:Moebius reactor\n Increasing the Ghost's energy limit to from 200 to 250 (+50) and starting energy by 12
description_zh:莫比乌斯反应器\n将幽灵的能量上限从200增加到250 (+50)，初始能量增加12
price:Gas=350
playSoundToPlayer:ROOT:/DATA/Terran/research.ogg:0.4
onlyOneUnitAtATime: true
iconExtraColor:#FFFFFFFF
iconExtraImage:moebiusReactor.png
allowMultipleInQueue:false
addGlobalTeamTags:MoebiusReactor
ai_isHighPriority:true

[hiddenAction_removeAllQueue]
autoTrigger: if ((not self.getOffsetAbsolute(x=-90,y=-20).self.hasUnitInTeam(withTag="ScienceFacility",withinRange=10) or self.getOffsetAbsolute(x=-90,y=-20).nearestUnit(withTag="ScienceFacility",withinRange=10,relation="own").z!=self.z) and not self.isControlledByAI()) or (not self.hasUnitInTeam(withTag="ScienceFacility", withinRange=100) and self.isControlledByAI()) and self.queueSize>0
refundAllQueuedItems:true

[hiddenAction_enemyCapture]
autoTrigger: if self.getOffsetAbsolute(x=-90,y=-20).nearestUnit(withTag="ScienceFacility",withinRange=10,relation="any")!=nullUnit and self.getOffsetAbsolute(x=-90,y=-20).nearestUnit(withTag="ScienceFacility",withinRange=10,relation="any").z==self.z and self.getOffsetAbsolute(x=-90,y=-20).nearestUnit(withTag="ScienceFacility",withinRange=10,relation="any").teamId!=self.teamId
refundAllQueuedItems:true
switchToTeam: self.getOffsetAbsolute(x=-90,y=-20).nearestUnit(withTag="ScienceFacility",withinRange=10,relation="any").teamId

[decal_connection]
image:covertOps_connection.png
onlyOnNonPreview:true
alwaysStartDirAtZero:true
teamColors:false
xOffsetAbsolute:-22
yOffsetAbsolute:-22
frame_width:  84
frame_height: 84
frame: memory.connectionFrame
onlyWhileAlive: true

[decal_fire]
@copyFromSection: template_fire
isVisible: if self.hp<self.maxHp*0.85
image:ROOT:/DATA/Terran/fire.png
frame: select(self.hp<self.maxHp*0.5,12,0)+(self.timeAlive*12%12)
xOffsetAbsolute:-13
yOffsetAbsolute:-12

[graphics]
total_frames: 2
imageScale:1
image:        covertOps.png
image_back:   NONE
image_wreak:ROOT:/DATA/Terran/dead.png
image_turret: NONE
drawLayer:experimentals
image_shadow:shadow_co.png
shadowOffsetX:0
shadowOffsetY:0
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 36

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 6


maxAttackRange: 0
shootDelay: 80

[movement]
movementType: BUILDING

[ai]
buildPriority: 0.07
noneInBaseExtraPriority: 0.04
noneGlobalExtraPriority: 0.06
disableUse: true
maxEachBase: 0
maxGlobal: 0

[animation_build]
body_0s: {frame:0}
body_0.2s: {frame:0}
body_0.4s: {frame:1}
body_0.6s: {frame:1}

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_grn_2.png
yOffsetAbsolute:10

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_lrg_red_2.png
yOffsetAbsolute:10

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_yell_2.png
yOffsetAbsolute:10

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:23
image:ROOT:/DATA/total/hp_24.png
frame_width:73
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:45