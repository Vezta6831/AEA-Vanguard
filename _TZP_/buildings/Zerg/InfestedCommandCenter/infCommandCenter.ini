[core]
copyFrom:ROOT:/DATA/total/baseAttack.template, ROOT:/DATA/total/debuffs.template, ROOT:/DATA/Terran/buildings.template, ROOT:/DATA/total/customUI.template
name: InfCommandCenter
tags: InfCommandCenter, resourceDropoff,building,vis17
class: CustomUnitMetadata
price: 0
maxHp: 3500
selfRegenRate:0.04
mass: 9000
armour:1
hideScorchMark: true
fogOfWarSightRange:17
displayText_ru: Заражённый Командный центр
displayText_zh:被感染的指挥中心
displayText:Infested Command center
footprint: -2,-2,3,1
constructionFootprint:-2,-2,3,1
buildingToFootprintOffsetX:20
buildingToFootprintOffsetY:-10
exit_x:0
exit_y:40
exit_moveAwayAmount:45
techLevel: 1
buildSpeed: 1
selfBuildRate:2
radius: 70
isBuilding: true
isBio: true
isUnrepairableUnit:true
soundOnNewSelection:CC.ogg:0.3
borrowResourcesWhileAlive:supply=-10
effectOnDeath:CUSTOM:corpse
defineUnitMemory: unit rally

[action_rally]
isVisible: if self.resource(type='select',equalTo=0)
isActive: if self.resource(type='select',equalTo=0)
price: 0
pos: 0
text_ru: Точка сбора
text: Rally point
text_zh:集结点
displayType:infoOnly
buildSpeed: 0
ai_isDisabled: true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/total/rallyIcon.png
highPriorityQueue: true
fireTurretXAtGround:rally
setUnitMemory:rally=thisActionTarget

[canBuild_1]
name: infTerran


[effect_corpse]
alwayStartDirAtZero:true
attachedToUnit: false
life: 120
alpha: 12
image:ROOT:/DATA/Terran/death.png
priority: critical
drawUnderUnits:false
animateFrameStart:0
animateFrameEnd:11
animateFrameSpeed:0.2
frame_width:  252
frame_height: 200

[effect_up]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 10
image:ROOT:/DATA/Terran/dust_6.png
priority: critical
drawUnderUnits:false
animateFrameStart:0
animateFrameEnd:9
animateFrameSpeed:0.2
frame_width:  48
frame_height: 48
xOffsetAbsolute: -40
yOffsetAbsolute: 30

[effect_up_2]
image:ROOT:/DATA/Terran/dust_8.png
xOffsetAbsolute: 0
yOffsetAbsolute: 45
@copyFromSection: effect_up

[effect_up_3]
image:ROOT:/DATA/Terran/dust_7.png
xOffsetAbsolute: 40
yOffsetAbsolute: 30
@copyFromSection: effect_up
alsoPlaySound:ROOT:/DATA/Terran/liftoff.wav

[action_clear]
isVisible:true
isActive:true
displayType:infoOnly
buildSpeed:1s
price:0
text_ru:Уничтожить
text:Delete
text_zh:自毁
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/total/delete.png
addResources:hp=-1500
ai_isDisabled:true

[action_air]
isVisible:true
isActive:true
text_ru:Поднять здание
text:Rise up
text_zh:起飞
ai_isDisabled:true
iconExtraColor:#FFFFFFFF
iconExtraImage:ROOT:/DATA/Terran/liftoff.png
iconImage:ROOT:/DATA/Terran/liftoff.png
convertTo:InfCommandCenterAir
displayType:infoOnly
buildSpeed: 0.8s
highPriorityQueue: true
whenBuilding_temporarilyConvertTo: InfCommandCenterAir
whenBuilding_playAnimation:air
whenBuilding_cannotMove:true
whenBuilding_rotateTo:270
canPlayerCancel:false

[hiddenAction_fire]
@copyFrom_skipThisSection:true

[decal_fire]
@copyFromSection: template_fire
isVisible: if self.hp<self.maxHp*0.85
image:ROOT:/DATA/Terran/fire2.png
frame: select(self.hp<self.maxHp*0.75,12,0)+(self.timeAlive*12%12)
xOffsetAbsolute:30
yOffsetAbsolute:-20

[decal_fire_2]
@copyFromSection: template_fire
isVisible: if self.hp<self.maxHp*0.65
image:ROOT:/DATA/Terran/fire.png
frame: select(self.hp<self.maxHp*0.55,12,0)+(self.timeAlive*12%12)
xOffsetAbsolute:-40
yOffsetAbsolute:-30

[decal_fire_3]
@copyFromSection: template_fire
isVisible: if self.hp<self.maxHp*0.50
image:ROOT:/DATA/Terran/fire3.png
frame: select(self.hp<self.maxHp*0.40,12,0)+(self.timeAlive*12%12)
xOffsetAbsolute:-8
yOffsetAbsolute:-28

[graphics]
image_offsetY:-4
image: infestedCC.png
image_back:   NONE
image_wreak:ROOT:/DATA/Terran/dead2.png
image_turret: NONE
drawLayer:experimentals
rotate_with_direction:false
image_shadow: AUTO_ANIMATED
shadowOffsetX:-5
shadowOffsetY:-8
frame_width:  128
frame_height: 160

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[turret_rally]
x: 0
y: 0
limitingRange:9999
canShoot: false
projectile:rally

[projectile_rally]
life:0
speed:0
invisible: true
directDamage: 0
explodeEffect:NONE
explodeEffectOnShield:NONE

[movement]
movementType: BUILDING
heightChangeRate: 6

[ai]
buildPriority: 0.03
noneInBaseExtraPriority: 0.07
noneGlobalExtraPriority: 0.06
maxEachBase: 1

[animation_build]
onActions : queuedUnits
body_0s: {frame:0}
body_0.1s: {frame:1}
body_0.2s: {frame:1}

[animation_air]
body_0s: {frame:2}
body_0.2s: {frame:3}
body_0.4s: {frame:4}
body_0.6s: {frame:5}
body_0.8s: {frame:5}
effect_0s: {name:NONE}
effect_0.1s: {name:CUSTOM|up,x:0,y:0}
effect_0.1006s: {name:CUSTOM|up_2,x:0,y:0}
effect_0.1005s: {name:CUSTOM|up_3,x:0,y:0}

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_bldng_grn_2.png
yOffsetAbsolute:5

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_bldng_red_2.png
yOffsetAbsolute:5

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_bldng_yell_2.png
yOffsetAbsolute:5

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:35
image:ROOT:/DATA/total/hp_36.png
frame_width:109
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:54

[decal_rally]
@define frameStart: 0
@define totalFrames:10
@define framesPerSec: 16
isVisible: if memory.rally!=nullUnit
layer: beforeUI
onlyWhenSelectedByOwnPlayer:true
onlyOnNonPreview:true
alwaysStartDirAtZero:true
teamColors:false
image:ROOT:/DATA/total/rally.png
frame_width:44
frame_height:28
frame: ${frameStart}+self.timeAlive*${framesPerSec}%${totalFrames}
basePosition: memory.rally
onlyWhileAlive: true