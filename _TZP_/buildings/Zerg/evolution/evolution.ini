text: Upgrade
text_zh:升级
description_ru: Панцирь\n След. уровень: ${upgradeLevel}\n Увеличивает защиту у наземных зергов
description: Carapace\n Next level: ${upgradeLevel}\n Increases the armor value of all Zerg ground forces
description_zh:硬化甲壳\n 下一级别：${upgradeLevel}\n增加所有虫族地面部队的护甲值
buildSpeed: ${148+20*upgradeLevel}s
highPriorityQueue: true
playSoundToPlayer:ROOT:/DATA/Zerg/upgrade.wav:0.4
onlyOneUnitAtATime: true
iconExtraColor:#FFFFFFFF
iconExtraImage:groundCarapace.png
allowMultipleInQueue:false
ai_isHighPriority:true
setResourcesWithLogic: ZergGroundCarapace=${upgradeLevel}

