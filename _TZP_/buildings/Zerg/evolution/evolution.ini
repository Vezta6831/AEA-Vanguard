[core]
copyFrom:ROOT:/DATA/Zerg/buildings.template, ROOT:/DATA/Zerg/zergUpgrades.template, ROOT:/DATA/total/customUI.template
name: Evolution
tags: Evolution,building,EvolutionAI,vis17
maxHp: 1750
armour:1
displayText_ru: Эволюционная камера
displayText: Evolution chamber
displayText_zh:进化腔
footprint: -2,-2,2,1
constructionFootprint:-2,-2,2,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0
radius: 60
effectOnDeath: CUSTOM:corpse
soundOnNewSelection:Evolution.ogg:0.3

[decal_blood]
@copyFromSection: template_blood
isVisible: if self.hp<self.maxHp*0.85
image:ROOT:/DATA/Zerg/blood3.png
frame: select(self.hp<self.maxHp*0.75,6,0)+(self.timeAlive*12%6)
xOffsetAbsolute:5
yOffsetAbsolute:4

[decal_blood_2]
@copyFromSection: template_blood
isVisible: if self.hp<self.maxHp*0.65
image:ROOT:/DATA/Zerg/blood2.png
frame: select(self.hp<self.maxHp*0.55,6,0)+(self.timeAlive*12%6)
xOffsetAbsolute:-30
yOffsetAbsolute:11

[decal_blood_3]
@copyFromSection: template_blood
isVisible: if self.hp<self.maxHp*0.5
image:ROOT:/DATA/Zerg/blood4.png
frame: select(self.hp<self.maxHp*0.4,6,0)+(self.timeAlive*12%6)
xOffsetAbsolute:14
yOffsetAbsolute:-18

[action_clear]
addResources:hp=-100

[action_meleeAttackT2]
@define upgradeLevel:1
isVisible: if self.resource.ZergMeleeAttack==${upgradeLevel-1}
isActive: if self.resource.ZergMeleeAttack==${upgradeLevel-1}
displayType: queueUnit
price:Minerals=${50+50*upgradeLevel},Gas=${50+50*upgradeLevel}
text_ru: Улучшение
text: Upgrade
text_zh:升级
description_ru: Ближняя атака\n След. уровень: ${upgradeLevel}\n Увеличивает урон у Зерглингов, Ультралисков и Брудлингов
description_zh:近战攻击\n 下一级别：${upgradeLevel}\n增加跳虫、雷兽和巢虫的攻击伤害
description:Melee attack\n Next level: ${upgradeLevel}\n Increases the attack damage of Zerglings, Ultralisks, and Broodlings
buildSpeed: ${148+20*upgradeLevel}s
highPriorityQueue: true
iconExtraColor:#FFFFFFFF
iconExtraImage:meleeAttack.png
playSoundToPlayer:ROOT:/DATA/Zerg/upgrade.wav:0.4
onlyOneUnitAtATime: true
allowMultipleInQueue:false
ai_isHighPriority:true
setResourcesWithLogic: ZergMeleeAttack=${upgradeLevel}

[action_meleeAttackT3]
@copyFromSection: action_meleeAttackT2
@define upgradeLevel:2
isLocked: if not self.hasUnitInTeam(withTag='Lair')
isLockedMessage_ru:Требуется:\n  >Логово
isLockedMessage:Requires:\n  >Lair
isLockedMessage_zh:需要:\n >虫穴

[action_meleeAttackT4]
@copyFromSection: action_meleeAttackT2
@define upgradeLevel:3
isLocked: if not self.hasUnitInTeam(withTag='Hive')
isLockedMessage_ru:Требуется:\n  >Улей
isLockedMessage:Requires:\n  >Hive
isLockedMessage_zh:需要:\n >蜂巢

[action_rangeAttackT2]
@define upgradeLevel:1
isVisible: if self.resource.ZergRangeAttack==${upgradeLevel-1}
isActive: if self.resource.ZergRangeAttack==${upgradeLevel-1}
