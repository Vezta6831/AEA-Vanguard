text: Upgrade
text_zh:升级
description_ru: Дистанционная атака\n След. уровень: ${upgradeLevel}\n Увеличивает урон Гидралисков и Скрытней
description:Range attack\n Next level: ${upgradeLevel}\n Increases the attack damage of Hydralisks and Lurkers
description_zh:远程攻击\n 下一级别：${upgradeLevel}\n增加刺蛇的攻击伤害
buildSpeed: ${148+20*upgradeLevel}s
highPriorityQueue: true
iconExtraColor:#FFFFFFFF
iconExtraImage:rangeAttack.png
playSoundToPlayer:ROOT:/DATA/Zerg/upgrade.wav:0.4
onlyOneUnitAtATime: true
allowMultipleInQueue:false
ai_isHighPriority:true
setResourcesWithLogic: ZergRangeAttack=${upgradeLevel}

