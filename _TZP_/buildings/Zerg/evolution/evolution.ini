@define upgradeLevel:1
isVisible: if self.resource.ZergGroundCarapace==${upgradeLevel-1}
isActive: if self.resource.ZergGroundCarapace==${upgradeLevel-1}
displayType: queueUnit
price:Minerals=${75+75*upgradeLevel},Gas=${75+75*upgradeLevel}
