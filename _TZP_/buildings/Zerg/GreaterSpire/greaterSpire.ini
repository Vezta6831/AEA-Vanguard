[core]
copyFrom:ROOT:/DATA/Zerg/buildings.template, ROOT:/DATA/Zerg/zergUpgrades.template, ROOT:/DATA/total/customUI.template
name: GreaterSpire
tags: GreaterSpire, Spire,building,SpireAI,vis17
maxHp: 3200
armour:1
displayText: Шпиль величия
displayDescription: -Позволяет порождать улучшенных летающих зергов
displayText_zh:巨型尖塔
footprint: -1,-1,1,1
constructionFootprint:-1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:20
radius: 40
effectOnDeath: CUSTOM:corpse
soundOnNewSelection:GreaterSpire.ogg:0.3
selfRegenRate:0.045

[decal_blood]
@copyFromSection: template_blood
isVisible: if self.hp<self.maxHp*0.85
image:ROOT:/DATA/Zerg/blood3.png
frame: select(self.hp<self.maxHp*0.7,6,0)+(self.timeAlive*12%6)
xOffsetAbsolute:-7
yOffsetAbsolute:-53

[decal_blood_2]
@copyFromSection: template_blood
isVisible: if self.hp<self.maxHp*0.55
image:ROOT:/DATA/Zerg/blood2.png
frame: select(self.hp<self.maxHp*0.4,6,0)+(self.timeAlive*12%6)
xOffsetAbsolute:14
yOffsetAbsolute:-60

[action_clear]
addResources:hp=-1500

[action_attackT2]
@define upgradeLevel:1
isVisible: if self.resource.ZergAirAttack==${upgradeLevel-1}
isActive: if self.resource.ZergAirAttack==${upgradeLevel-1}
displayType: queueUnit
price:Minerals=${25+75*upgradeLevel},Gas=${25+75*upgradeLevel}
text_ru: Улучшение
text: Upgrade
text_zh:升级
description_ru:Воздушная атака\n След. уровень: ${upgradeLevel}\n Увеличивает урон воздушных юнитов Зергов
description:Flyer attack\n Next level: ${upgradeLevel}\n Increases the attack damage of all Zerg flyer forces
description_zh:空军攻击\n 下一级别：${upgradeLevel}\n增加所有虫族飞行部队的攻击伤害
buildSpeed: ${148+20*upgradeLevel}s
highPriorityQueue: true
iconExtraColor:#FFFFFFFF
iconExtraImage:airAttack.png
playSoundToPlayer:ROOT:/DATA/Zerg/upgrade.wav:0.4
onlyOneUnitAtATime: true
allowMultipleInQueue:false
ai_isHighPriority:true
setResourcesWithLogic: ZergAirAttack=${upgradeLevel}

[action_attackT3]
@copyFromSection: action_attackT2
@define upgradeLevel:2
isLocked: if not self.hasUnitInTeam(withTag='Lair')
isLockedMessage_ru:Требуется:\n  >Логово
isLockedMessage:Requires:\n  >Lair
isLockedMessage_zh:需要:\n >虫穴

[action_attackT4]
@copyFromSection: action_attackT2
@define upgradeLevel:3
isLocked: if not self.hasUnitInTeam(withTag='Hive')
isLockedMessage_ru:Требуется:\n  >Улей
isLockedMessage:Requires:\n  >Hive
isLockedMessage_zh:需要:\n >蜂巢

[action_armorT2]
@define upgradeLevel:1
isVisible: if self.resource.ZergAirCarapace==${upgradeLevel-1}
isActive: if self.resource.ZergAirCarapace==${upgradeLevel-1}
displayType: queueUnit
price:Minerals=${75+75*upgradeLevel},Gas=${75+75*upgradeLevel}
text_ru: Улучшение
text: Upgrade
text_zh:升级
description_ru:Панцирь\n След. уровень: ${upgradeLevel}\n Увеличивает защиту воздушных юнитов Зергов
description:Carapace\n Next level: ${upgradeLevel}\n Increases the armor value of all Zerg flyer forces
description_zh:硬化甲壳\n 下一级别：${upgradeLevel}\n增加所有虫族飞行部队的护甲值
buildSpeed: ${148+20*upgradeLevel}s
highPriorityQueue: true
iconExtraColor:#FFFFFFFF
iconExtraImage:airCarapace.png
playSoundToPlayer:ROOT:/DATA/Zerg/upgrade.wav:0.4
onlyOneUnitAtATime: true
allowMultipleInQueue:false
ai_isHighPriority:true
setResourcesWithLogic: ZergAirCarapace=${upgradeLevel}

[action_armorT3]
@copyFromSection: action_armorT2
@define upgradeLevel:2
isLocked: if not self.hasUnitInTeam(withTag='Lair')
isLockedMessage_ru:Требуется:\n  >Логово
isLockedMessage:Requires:\n  >Lair
isLockedMessage_zh:需要:\n >虫穴

[action_armorT4]
@copyFromSection: action_armorT2
@define upgradeLevel:3
isLocked: if not self.hasUnitInTeam(withTag='Hive')
isLockedMessage_ru:Требуется:\n  >Улей
isLockedMessage:Requires:\n  >Hive
isLockedMessage_zh:需要:\n >蜂巢

[graphics]
image_offsetY:-30
total_frames: 3
imageScale: 1
image: greaterSpire.png
image_back:   NONE
image_wreak:ROOT:/DATA/Zerg/dead.png
image_turret: NONE
drawLayer:experimentals
image_shadow:shadow.png
shadowOffsetX:-2
shadowOffsetY:-7
animation_idle_start: 0
animation_idle_end: 2
animation_idle_speed: 8

[ai]
maxEachBase: 1
maxGlobal: 1
upgradedFrom: CocoonSpire

[decal_grn_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_grn_2.png

[decal_red_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByEnemyPlayer:true
image:ROOT:/DATA/total/circle_lrg_red_2.png

[decal_yellow_circle]
@copyFromSection: template_customSelectCircle
onlyWhenSelectedByAllyNotOwnPlayer:true
image:ROOT:/DATA/total/circle_lrg_yell_2.png

[decal_hp]
@copyFromSection: template_customBar
@define totalFrames:23
image:ROOT:/DATA/total/hp_24.png
frame_width:73
frame_height:5
frame:int((self.hp*100/self.maxHp)/(100/${totalFrames}))
yOffsetAbsolute:35